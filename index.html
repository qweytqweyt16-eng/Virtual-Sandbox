<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#05060a" />
<title>VOIDBOX — VR Sandbox</title>
<style>
  :root { --accent:#4af; --bg:#05060a; }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg); color:#dfe8f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #boot {
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 40%, #101a2c 0%, #05060a 70%);
    transition: opacity .5s ease; text-align:center; padding:24px;
  }
  #boot.hidden { opacity:0; pointer-events:none; }
  h1 {
    font-size: clamp(38px, 12vw, 92px); letter-spacing: .22em; font-weight: 800;
    margin: 0 0 6px 0;
    background: linear-gradient(180deg,#eaf4ff 0%, #4af 60%, #1a5fb4 100%);
    -webkit-background-clip: text; background-clip:text; color: transparent;
    text-shadow: 0 0 40px rgba(70,170,255,.25);
  }
  .sub { font-size: clamp(11px,3vw,15px); letter-spacing:.42em; color:#5d7ea6; margin-bottom:38px; text-transform:uppercase; }
  .ring {
    width: 64px; height: 64px; margin-bottom: 26px;
    border-radius: 50%; border: 3px solid rgba(70,170,255,.15);
    border-top-color: var(--accent); animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { font-size: 14px; color:#7f9ec4; min-height: 22px; letter-spacing:.06em; }
  #enterBtn {
    margin-top: 26px; padding: 18px 52px; font-size: 19px; font-weight: 700; letter-spacing:.16em;
    color:#02121f; background: linear-gradient(180deg,#7fd0ff,#2a9df4);
    border: none; border-radius: 42px; cursor: pointer; display:none;
    box-shadow: 0 8px 40px rgba(42,157,244,.45), inset 0 1px 0 rgba(255,255,255,.55);
    transition: transform .12s ease, box-shadow .2s ease;
  }
  #enterBtn:active { transform: scale(.95); }
  #enterBtn:hover { box-shadow: 0 10px 60px rgba(42,157,244,.75), inset 0 1px 0 rgba(255,255,255,.6); }
  #err { margin-top:20px; color:#ff6b6b; font-size:14px; max-width:520px; line-height:1.55; display:none; }
  #hint { margin-top:30px; font-size:12px; color:#3d5771; letter-spacing:.1em; line-height:1.9; }
  .k { color:#6aa9e0; font-weight:700; }
</style>
</head>
<body>

<div id="boot">
  <h1>VOIDBOX</h1>
  <div class="sub">Infinite VR Sandbox</div>
  <div class="ring" id="ring"></div>
  <div id="status">Checking WebXR…</div>
  <button id="enterBtn">ENTER VOIDBOX</button>
  <div id="err"></div>
  <div id="hint">
    <span class="k">TRIGGER</span> grab &nbsp;·&nbsp;
    <span class="k">GRIP</span> secondary &nbsp;·&nbsp;
    <span class="k">B / Y</span> tool wheel<br />
    <span class="k">A / X</span> spawn catalog &nbsp;·&nbsp;
    <span class="k">STICK</span> teleport / turn
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
/* ==========================================================================
   VOIDBOX — VR SANDBOX
   Single file. Three.js r160 + WebXR. No external assets.
   ==========================================================================
   SECTIONS
     01. CONFIG & CONSTANTS
     02. MATH / UTILITY HELPERS
     03. AUDIO ENGINE (procedural Web Audio, spatial)
     04. PROCEDURAL TEXTURES
     05. MATERIAL LIBRARY
     06. GEOMETRY / ITEM FACTORY
     07. PHYSICS ENGINE (custom rigid bodies)
     08. PARTICLE / FX SYSTEM
     09. PLAYER RIG & CONTROLLERS
     10. LOCOMOTION
     11. GRAB SYSTEM
     12. TOOLS
     13. RADIAL MENU
     14. SPAWN CATALOG (3D panel)
     15. ENVIRONMENT PRESETS
     16. SAVE / LOAD (IndexedDB)
     17. ADAPTIVE PERFORMANCE
     18. MAIN LOOP
     19. BOOTSTRAP
   ========================================================================== */

import * as THREE from 'three';

/* ==========================================================================
   01. CONFIG & CONSTANTS
   ========================================================================== */
const VERSION = '1.0.0';

const CONFIG = {
  physics: {
    gravity: -9.81,
    fixedStep: 1 / 72,
    maxSubSteps: 4,
    restitution: 0.28,
    friction: 0.62,
    linearDamping: 0.06,
    angularDamping: 0.10,
    sleepLinear: 0.10,
    sleepAngular: 0.30,
    sleepTime: 0.85,
    maxBodies: 260,
    skin: 0.0015,
  },
  render: {
    foveation: 2,
    scaleDefault: 1.0,
    toneMappingExposure: 1.05,
  },
  input: {
    snapTurnAngle: Math.PI / 6,
    deadzone: 0.18,
    teleportMaxDist: 14,
    throwScale: 1.25,
  },
  world: {
    floorY: 0,
    bounds: 60,
    killY: -25,
  },
  audio: {
    maxVoices: 24,
    masterVolume: 0.75,
  },
};

const TEMP = {
  v1: new THREE.Vector3(), v2: new THREE.Vector3(), v3: new THREE.Vector3(),
  v4: new THREE.Vector3(), v5: new THREE.Vector3(), v6: new THREE.Vector3(),
  q1: new THREE.Quaternion(), q2: new THREE.Quaternion(), q3: new THREE.Quaternion(),
  m1: new THREE.Matrix4(), m2: new THREE.Matrix4(),
  c1: new THREE.Color(), c2: new THREE.Color(),
  e1: new THREE.Euler(),
};

/* ==========================================================================
   02. MATH / UTILITY HELPERS
   ========================================================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const nowMs = () => performance.now();
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));

function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}

/** Axis vector from a quaternion's column. */
function quatAxis(q, i, out) {
  const x = q.x, y = q.y, z = q.z, w = q.w;
  if (i === 0) out.set(1 - 2 * (y * y + z * z), 2 * (x * y + z * w), 2 * (x * z - y * w));
  else if (i === 1) out.set(2 * (x * y - z * w), 1 - 2 * (x * x + z * z), 2 * (y * z + x * w));
  else out.set(2 * (x * z + y * w), 2 * (y * z - x * w), 1 - 2 * (x * x + y * y));
  return out;
}

/** Cheap deterministic PRNG for procedural content. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const RNG = mulberry32(1337);

/* ==========================================================================
   03. AUDIO ENGINE — procedural, spatial, pooled
   ========================================================================== */
const Audio = {
  ctx: null,
  master: null,
  sfxGain: null,
  ambGain: null,
  noiseBuf: null,
  ready: false,
  voices: 0,
  muted: false,

  init() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
    } catch (e) { return; }

    const ctx = this.ctx;
    this.master = ctx.createGain();
    this.master.gain.value = CONFIG.audio.masterVolume;
    this.master.connect(ctx.destination);

    this.sfxGain = ctx.createGain();
    this.sfxGain.gain.value = 0.9;
    this.sfxGain.connect(this.master);

    this.ambGain = ctx.createGain();
    this.ambGain.gain.value = 0.0;
    this.ambGain.connect(this.master);

    // Soft master limiter
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12;
    comp.knee.value = 24;
    comp.ratio.value = 8;
    comp.attack.value = 0.004;
    comp.release.value = 0.16;
    this.master.disconnect();
    this.master.connect(comp);
    comp.connect(ctx.destination);

    // White-noise buffer (2s, reused by all noise voices)
    const len = Math.floor(ctx.sampleRate * 2);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;

    this.ready = true;
  },

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  updateListener(camera) {
    if (!this.ready) return;
    const l = this.ctx.listener;
    const p = camera.getWorldPosition(TEMP.v1);
    const f = camera.getWorldDirection(TEMP.v2);
    const u = TEMP.v3.set(0, 1, 0).applyQuaternion(camera.getWorldQuaternion(TEMP.q1));
    if (l.positionX) {
      l.positionX.value = p.x; l.positionY.value = p.y; l.positionZ.value = p.z;
      l.forwardX.value = f.x; l.forwardY.value = f.y; l.forwardZ.value = f.z;
      l.upX.value = u.x; l.upY.value = u.y; l.upZ.value = u.z;
    } else if (l.setPosition) {
      l.setPosition(p.x, p.y, p.z);
      l.setOrientation(f.x, f.y, f.z, u.x, u.y, u.z);
    }
  },

  _panner(pos) {
    const ctx = this.ctx;
    const p = ctx.createPanner();
    p.panningModel = 'HRTF';
    p.distanceModel = 'inverse';
    p.refDistance = 1.2;
    p.maxDistance = 40;
    p.rolloffFactor = 1.3;
    p.coneInnerAngle = 360;
    if (p.positionX) {
      p.positionX.value = pos.x; p.positionY.value = pos.y; p.positionZ.value = pos.z;
    } else if (p.setPosition) {
      p.setPosition(pos.x, pos.y, pos.z);
    }
    return p;
  },

  _voice() {
    if (!this.ready || this.muted) return false;
    if (this.voices >= CONFIG.audio.maxVoices) return false;
    this.voices++;
    return true;
  },

  _release(node, when) {
    setTimeout(() => { this.voices = Math.max(0, this.voices - 1); }, Math.max(30, (when || 0.2) * 1000));
  },

  /** Simple oscillator blip. */
  tone(opts) {
    if (!this._voice()) return;
    const ctx = this.ctx;
    const t0 = ctx.currentTime + (opts.delay || 0);
    const dur = opts.dur || 0.15;

    const osc = ctx.createOscillator();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(opts.freq || 440, t0);
    if (opts.sweepTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opts.sweepTo), t0 + dur);

    const g = ctx.createGain();
    const vol = opts.gain != null ? opts.gain : 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    let out = g;
    if (opts.pos) {
      const panner = this._panner(opts.pos);
      g.connect(panner);
      panner.connect(this.sfxGain);
    } else {
      g.connect(this.sfxGain);
    }
    osc.connect(g);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
    this._release(osc, dur);
  },

  /** Filtered noise burst. */
  noise(opts) {
    if (!this._voice()) return;
    const ctx = this.ctx;
    const t0 = ctx.currentTime + (opts.delay || 0);
    const dur = opts.dur || 0.2;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.loop = true;
    src.playbackRate.value = opts.rate || 1;

    const flt = ctx.createBiquadFilter();
    flt.type = opts.filter || 'bandpass';
    flt.frequency.setValueAtTime(opts.freq || 900, t0);
    if (opts.sweepTo) flt.frequency.exponentialRampToValueAtTime(Math.max(40, opts.sweepTo), t0 + dur);
    flt.Q.value = opts.q != null ? opts.q : 1.1;

    const g = ctx.createGain();
    const vol = opts.gain != null ? opts.gain : 0.18;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    src.connect(flt);
    flt.connect(g);

    if (opts.pos) {
      const panner = this._panner(opts.pos);
      g.connect(panner);
      panner.connect(this.sfxGain);
    } else {
      g.connect(this.sfxGain);
    }

    src.start(t0);
    src.stop(t0 + dur + 0.03);
    this._release(src, dur);
  },

  /* ---- Named game sounds ---- */
  uiTick(pos) {
    this.tone({ freq: 1180, sweepTo: 1650, dur: 0.055, type: 'triangle', gain: 0.07, pos });
  },
  uiConfirm(pos) {
    this.tone({ freq: 620, sweepTo: 1240, dur: 0.13, type: 'sine', gain: 0.11, pos });
  },
  grab(pos, material) {
    if (material === 'metal') this.noise({ freq: 2400, sweepTo: 1600, dur: 0.07, gain: 0.06, q: 3, pos });
    else if (material === 'wood') this.noise({ freq: 620, sweepTo: 400, dur: 0.09, gain: 0.09, q: 1.4, pos });
    else this.noise({ freq: 1100, sweepTo: 780, dur: 0.06, gain: 0.07, q: 1.8, pos });
  },
  release(pos) {
    this.tone({ freq: 520, sweepTo: 320, dur: 0.07, type: 'sine', gain: 0.05, pos });
  },
  whoosh(pos, strength) {
    const s = clamp(strength || 1, 0.4, 2.2);
    this.noise({ freq: 380, sweepTo: 1500, dur: 0.20 * s, gain: 0.07 * s, q: 0.8, pos, filter: 'bandpass' });
  },
  impact(pos, strength, material) {
    const s = clamp(strength, 0.08, 1);
    if (material === 'metal') {
      this.tone({ freq: 320 + s * 500, sweepTo: 180, dur: 0.18 + s * 0.2, type: 'triangle', gain: 0.16 * s, pos });
      this.noise({ freq: 3200, sweepTo: 1200, dur: 0.09, gain: 0.10 * s, q: 3.5, pos });
    } else if (material === 'wood') {
      this.tone({ freq: 180 + s * 120, sweepTo: 70, dur: 0.14, type: 'square', gain: 0.10 * s, pos });
      this.noise({ freq: 700, sweepTo: 300, dur: 0.10, gain: 0.10 * s, q: 1.2, pos });
    } else if (material === 'glass') {
      this.tone({ freq: 2200, sweepTo: 900, dur: 0.22, type: 'sine', gain: 0.10 * s, pos });
      this.noise({ freq: 5200, sweepTo: 2400, dur: 0.16, gain: 0.09 * s, q: 4, pos });
    } else {
      this.tone({ freq: 140 + s * 90, sweepTo: 60, dur: 0.12, type: 'sine', gain: 0.13 * s, pos });
      this.noise({ freq: 900, sweepTo: 400, dur: 0.07, gain: 0.08 * s, q: 1.4, pos });
    }
  },
  explode(pos) {
    this.tone({ freq: 120, sweepTo: 28, dur: 0.85, type: 'sine', gain: 0.42, pos });
    this.noise({ freq: 1800, sweepTo: 90, dur: 0.9, gain: 0.34, q: 0.5, pos, filter: 'lowpass' });
    this.noise({ freq: 4200, sweepTo: 700, dur: 0.35, gain: 0.16, q: 0.9, pos });
  },
  fire(pos) {
    this.noise({ freq: 900 + rand(-200, 200), sweepTo: 400, dur: 0.35, gain: 0.07, q: 0.7, pos });
  },
  bell(pos, freq) {
    this.tone({ freq: freq || 880, dur: 1.1, type: 'sine', gain: 0.14, pos });
    this.tone({ freq: (freq || 880) * 2.01, dur: 0.7, type: 'sine', gain: 0.05, pos });
    this.tone({ freq: (freq || 880) * 3.02, dur: 0.45, type: 'sine', gain: 0.03, pos });
  },
  drum(pos) {
    this.tone({ freq: 130, sweepTo: 55, dur: 0.3, type: 'sine', gain: 0.3, pos });
    this.noise({ freq: 1400, sweepTo: 300, dur: 0.12, gain: 0.12, q: 0.8, pos });
  },
  splash(pos) {
    this.noise({ freq: 2600, sweepTo: 500, dur: 0.4, gain: 0.14, q: 0.6, pos });
  },
  teleport(pos) {
    this.tone({ freq: 300, sweepTo: 1400, dur: 0.22, type: 'sine', gain: 0.10, pos });
    this.noise({ freq: 1200, sweepTo: 3400, dur: 0.18, gain: 0.06, q: 1.6, pos });
  },
  error(pos) {
    this.tone({ freq: 220, sweepTo: 120, dur: 0.14, type: 'square', gain: 0.07, pos });
  },
};

/* ==========================================================================
   04. PROCEDURAL TEXTURES (canvas 2D)
   ========================================================================== */
const TexCache = new Map();

function canvasTexture(key, size, draw, opts = {}) {
  if (TexCache.has(key)) return TexCache.get(key);
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  draw(ctx, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  if (opts.repeat) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(opts.repeat[0], opts.repeat[1]);
  }
  TexCache.set(key, t);
  return t;
}

const Textures = {
  noise(scale = 4, contrast = 40) {
    return canvasTexture('noise' + scale + contrast, 256, (ctx, s) => {
      const img = ctx.createImageData(s, s);
      for (let i = 0; i < s * s; i++) {
        const v = 128 + (Math.random() - 0.5) * contrast;
        img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    });
  },

  wood() {
    return canvasTexture('wood', 512, (ctx, s) => {
      ctx.fillStyle = '#8a5a32';
      ctx.fillRect(0, 0, s, s);
      for (let i = 0; i < 90; i++) {
        const y = Math.random() * s;
        ctx.strokeStyle = `rgba(${60 + Math.random() * 60 | 0},${35 + Math.random() * 40 | 0},${15 + Math.random() * 25 | 0},${0.15 + Math.random() * 0.35})`;
        ctx.lineWidth = 1 + Math.random() * 4;
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x <= s; x += 16) {
          ctx.lineTo(x, y + Math.sin(x * 0.02 + i) * 6 + (Math.random() - 0.5) * 3);
        }
        ctx.stroke();
      }
      for (let i = 0; i < 5; i++) {
        const x = Math.random() * s, y = Math.random() * s;
        ctx.fillStyle = 'rgba(50,28,12,.55)';
        ctx.beginPath(); ctx.ellipse(x, y, 8 + Math.random() * 10, 4 + Math.random() * 5, Math.random() * 3, 0, Math.PI * 2); ctx.fill();
      }
    }, { repeat: [1, 1] });
  },

  metal() {
    return canvasTexture('metal', 512, (ctx, s) => {
      const g = ctx.createLinearGradient(0, 0, s, s);
      g.addColorStop(0, '#9aa7b5'); g.addColorStop(0.5, '#c3cdd8'); g.addColorStop(1, '#7c8895');
      ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
      for (let i = 0; i < 700; i++) {
        ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.07})`;
        ctx.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 2, 1);
      }
      for (let i = 0; i < 200; i++) {
        ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.08})`;
        ctx.fillRect(Math.random() * s, Math.random() * s, 1, 1 + Math.random() * 3);
      }
    });
  },

  stone() {
    return canvasTexture('stone', 512, (ctx, s) => {
      ctx.fillStyle = '#6b6b6b'; ctx.fillRect(0, 0, s, s);
      for (let i = 0; i < 420; i++) {
        const v = 60 + Math.random() * 90 | 0;
        ctx.fillStyle = `rgba(${v},${v},${v + 4},${0.25 + Math.random() * 0.4})`;
        ctx.beginPath();
        ctx.arc(Math.random() * s, Math.random() * s, 2 + Math.random() * 18, 0, Math.PI * 2);
        ctx.fill();
      }
      for (let i = 0; i < 30; i++) {
        ctx.strokeStyle = `rgba(30,30,30,${0.15 + Math.random() * 0.3})`;
        ctx.lineWidth = 1 + Math.random() * 2;
        ctx.beginPath();
        let x = Math.random() * s, y = Math.random() * s;
        ctx.moveTo(x, y);
        for (let k = 0; k < 6; k++) { x += (Math.random() - 0.5) * 60; y += (Math.random() - 0.5) * 60; ctx.lineTo(x, y); }
        ctx.stroke();
      }
    }, { repeat: [1, 1] });
  },

  grass() {
    return canvasTexture('grass', 512, (ctx, s) => {
      ctx.fillStyle = '#3f7a2e'; ctx.fillRect(0, 0, s, s);
      for (let i = 0; i < 3200; i++) {
        const g = 90 + Math.random() * 110 | 0;
        ctx.strokeStyle = `rgba(${20 + Math.random() * 40 | 0},${g},${25 + Math.random() * 40 | 0},${0.3 + Math.random() * 0.5})`;
        ctx.lineWidth = 1 + Math.random();
        const x = Math.random() * s, y = Math.random() * s, h = 3 + Math.random() * 9;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (Math.random() - 0.5) * 3, y - h); ctx.stroke();
      }
    }, { repeat: [8, 8] });
  },

  sand() {
    return canvasTexture('sand', 512, (ctx, s) => {
      ctx.fillStyle = '#d9c48c'; ctx.fillRect(0, 0, s, s);
      for (let i = 0; i < 9000; i++) {
        const v = 180 + Math.random() * 60 | 0;
        ctx.fillStyle = `rgba(${v},${v - 18},${v - 60},${0.2 + Math.random() * 0.4})`;
        ctx.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 2, 1 + Math.random() * 2);
      }
    }, { repeat: [10, 10] });
  },

  checker() {
    return canvasTexture('checker', 256, (ctx, s) => {
      const n = 8, c = s / n;
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        ctx.fillStyle = (x + y) % 2 ? '#1b2333' : '#232f45';
        ctx.fillRect(x * c, y * c, c, c);
      }
    }, { repeat: [30, 30] });
  },

  radialGlow() {
    return canvasTexture('radial', 128, (ctx, s) => {
      const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.35, 'rgba(255,255,255,.65)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
    });
  },

  softDisc() {
    return canvasTexture('softdisc', 64, (ctx, s) => {
      const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      g.addColorStop(0, 'rgba(255,255,255,.95)');
      g.addColorStop(0.6, 'rgba(255,255,255,.35)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
    });
  },
};

/* ==========================================================================
   05. MATERIAL LIBRARY (shared instances)
   ========================================================================== */
const MatLib = {
  _cache: new Map(),

  get(key) {
    if (this._cache.has(key)) return this._cache.get(key);
    let m;
    switch (key) {
      case 'wood':
        m = new THREE.MeshStandardMaterial({ map: Textures.wood(), roughness: 0.85, metalness: 0.02 });
        break;
      case 'metal':
        m = new THREE.MeshStandardMaterial({ map: Textures.metal(), roughness: 0.32, metalness: 0.92 });
        break;
      case 'stone':
        m = new THREE.MeshStandardMaterial({ map: Textures.stone(), roughness: 0.95, metalness: 0.0 });
        break;
      case 'plastic':
        m = new THREE.MeshStandardMaterial({ color: 0x4aa3ff, roughness: 0.5, metalness: 0.05 });
        break;
      case 'glass':
        m = new THREE.MeshStandardMaterial({
          color: 0x9fd8ff, roughness: 0.06, metalness: 0.1,
          transparent: true, opacity: 0.35, depthWrite: false,
        });
        break;
      case 'emissive':
        m = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffcc66, emissiveIntensity: 1.6, roughness: 0.4 });
        break;
      case 'rubber':
        m = new THREE.MeshStandardMaterial({ color: 0x222529, roughness: 0.95, metalness: 0.0 });
        break;
      case 'water':
        m = new THREE.MeshStandardMaterial({ color: 0x2a7fd4, roughness: 0.12, metalness: 0.25, transparent: true, opacity: 0.72 });
        break;
      case 'grass':
        m = new THREE.MeshStandardMaterial({ map: Textures.grass(), roughness: 1.0, metalness: 0.0 });
        break;
      case 'sand':
        m = new THREE.MeshStandardMaterial({ map: Textures.sand(), roughness: 1.0, metalness: 0.0 });
        break;
      default:
        m = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8 });
    }
    this._cache.set(key, m);
    return m;
  },

  /** Clone-on-write so painting never mutates a shared material. */
  colorize(mesh, colorHex) {
    if (Array.isArray(mesh.material)) {
      mesh.material = mesh.material.map((m) => {
        const c = m.clone(); c.color.setHex(colorHex); return c;
      });
    } else {
      mesh.material = mesh.material.clone();
      mesh.material.color.setHex(colorHex);
    }
  },
};

/* ==========================================================================
   06. GEOMETRY / ITEM FACTORY
   ========================================================================== */
const GeoCache = new Map();

function G(key, factory) {
  if (GeoCache.has(key)) return GeoCache.get(key);
  const g = factory();
  GeoCache.set(key, g);
  return g;
}

function mesh(geo, mat, cast = false, receive = false) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast;
  m.receiveShadow = receive;
  return m;
}

/* --- Primitive builders ------------------------------------------------- */
const Prim = {
  box(w, h, d, mat) { return mesh(G(`box${w}_${h}_${d}`, () => new THREE.BoxGeometry(w, h, d)), mat); },
  sphere(r, mat, seg = 16) { return mesh(G(`sph${r}_${seg}`, () => new THREE.SphereGeometry(r, seg, seg)), mat); },
  cyl(rt, rb, h, mat, seg = 14) { return mesh(G(`cyl${rt}_${rb}_${h}_${seg}`, () => new THREE.CylinderGeometry(rt, rb, h, seg)), mat); },
  cone(r, h, mat, seg = 14) { return mesh(G(`cone${r}_${h}_${seg}`, () => new THREE.ConeGeometry(r, h, seg)), mat); },
  torus(r, t, mat, seg = 20) { return mesh(G(`tor${r}_${t}_${seg}`, () => new THREE.TorusGeometry(r, t, 10, seg)), mat); },
  capsule(r, h, mat) { return mesh(G(`cap${r}_${h}`, () => new THREE.CapsuleGeometry(r, h, 6, 12)), mat); },
  plane(w, h, mat) { return mesh(G(`pln${w}_${h}`, () => new THREE.PlaneGeometry(w, h)), mat); },
};

/* ==========================================================================
   07. PHYSICS ENGINE
   ========================================================================== */
let bodyIdCounter = 0;

class Body {
  constructor(object3D, def) {
    this.id = bodyIdCounter++;
    this.obj = object3D;
    this.pos = object3D.position;
    this.quat = object3D.quaternion;
    this.vel = new THREE.Vector3();
    this.angVel = new THREE.Vector3();

    this.shape = def.shape || 'box';
    if (this.shape === 'sphere') {
      this.radius = def.radius || 0.15;
      this.half = new THREE.Vector3(this.radius, this.radius, this.radius);
    } else {
      const s = def.size || [0.15, 0.15, 0.15];
      this.half = new THREE.Vector3(s[0], s[1], s[2]);
      this.radius = 0;
    }

    this.mass = def.mass != null ? def.mass : 1;
    this.invMass = this.mass > 0 ? 1 / this.mass : 0;

    const r = this.shape === 'sphere' ? this.radius : this.half.length();
    this.boundingRadius = r;
    this.invInertia = this.mass > 0 ? 1 / (this.mass * Math.max(0.0001, r * r) * 0.4) : 0;

    this.restitution = def.restitution != null ? def.restitution : CONFIG.physics.restitution;
    this.friction = def.friction != null ? def.friction : CONFIG.physics.friction;

    this.kinematic = false;
    this.sleeping = false;
    this.sleepTimer = 0;
    this.gravityScale = def.gravityScale != null ? def.gravityScale : 1;
    this.materialTag = def.mtl || def.material || 'plastic';
    this.itemId = def.id || null;
    this.burnable = def.burnable !== false;

    this.obj.userData.body = this;
    this.obj.userData.itemId = this.itemId;
    this.obj.userData.materialTag = this.materialTag;

    this._prevSpeed = 0;
  }

  wake() {
    this.sleeping = false;
    this.sleepTimer = 0;
  }

  /** World-space half-extent projected onto the world Y axis (for ground tests). */
  projectedHalfY() {
    if (this.shape === 'sphere') return this.radius;
    const e = this.obj.matrixWorld.elements;
    return Math.abs(e[1]) * this.half.x + Math.abs(e[5]) * this.half.y + Math.abs(e[9]) * this.half.z;
  }

  integrate(dt, gravity) {
    if (this.kinematic || this.sleeping || this.invMass === 0) return;

    this.vel.y += gravity * this.gravityScale * dt;
    this.vel.multiplyScalar(1 - CONFIG.physics.linearDamping * dt);
    this.angVel.multiplyScalar(1 - CONFIG.physics.angularDamping * dt);

    this.pos.addScaledVector(this.vel, dt);

    const w = this.angVel;
    const q = this.quat;
    const halfDt = dt * 0.5;
    const dqx = halfDt * (w.x * q.w + w.y * q.z - w.z * q.y);
    const dqy = halfDt * (w.y * q.w + w.z * q.x - w.x * q.z);
    const dqz = halfDt * (w.z * q.w + w.x * q.y - w.y * q.x);
    const dqw = halfDt * (-w.x * q.x - w.y * q.y - w.z * q.z);
    q.x += dqx; q.y += dqy; q.z += dqz; q.w += dqw;
    q.normalize();

    // Sleep detection
    const lin = this.vel.lengthSq();
    const ang = this.angVel.lengthSq();
    if (lin < CONFIG.physics.sleepLinear * CONFIG.physics.sleepLinear &&
        ang < CONFIG.physics.sleepAngular * CONFIG.physics.sleepAngular) {
      this.sleepTimer += dt;
      if (this.sleepTimer > CONFIG.physics.sleepTime) {
        this.sleeping = true;
        this.vel.set(0, 0, 0);
        this.angVel.set(0, 0, 0);
      }
    } else {
      this.sleepTimer = 0;
    }
  }
}

const Physics = {
  bodies: [],
  gravity: CONFIG.physics.gravity,
  accumulator: 0,
  lastStepCount: 0,

  add(body) {
    this.bodies.push(body);
    // Hard cap — remove oldest non-grabbed body
    if (this.bodies.length > CONFIG.physics.maxBodies) {
      for (let i = 0; i < this.bodies.length; i++) {
        const b = this.bodies[i];
        if (!b.kinematic && b !== Grab.heldA && b !== Grab.heldB) {
          World.removeBody(b, false);
          break;
        }
      }
    }
  },

  remove(body) {
    const i = this.bodies.indexOf(body);
    if (i >= 0) this.bodies.splice(i, 1);
  },

  step(dt) {
    const g = this.gravity;

    // Integrate
    for (let i = 0; i < this.bodies.length; i++) this.bodies[i].integrate(dt, g);

    // Broadphase + narrowphase (O(n^2) with early sphere reject — fine at ≤260 bodies)
    const n = this.bodies.length;
    for (let i = 0; i < n; i++) {
      const a = this.bodies[i];
      for (let j = i + 1; j < n; j++) {
        const b = this.bodies[j];
        if (a.invMass === 0 && b.invMass === 0) continue;
        if (a.kinematic && b.kinematic) continue;
        if (a.sleeping && b.sleeping) continue;
        if (a.kinematic && b.sleeping) continue;
        if (b.kinematic && a.sleeping) continue;

        // Broadphase
        const dx = b.pos.x - a.pos.x, dy = b.pos.y - a.pos.y, dz = b.pos.z - a.pos.z;
        const rr = a.boundingRadius + b.boundingRadius;
        if (dx * dx + dy * dy + dz * dz > rr * rr) continue;

        const contact = this.narrowphase(a, b);
        if (contact) {
          this.resolve(a, b, contact);
          if (a.sleeping && !b.sleeping) a.wake();
          if (b.sleeping && !a.sleeping) b.wake();
        }
      }
    }

    // Ground plane
    for (let i = 0; i < this.bodies.length; i++) {
      const b = this.bodies[i];
      if (b.invMass === 0 || b.kinematic) continue;
      const lowest = b.pos.y - b.projectedHalfY();
      if (lowest < CONFIG.world.floorY) {
        const pen = CONFIG.world.floorY - lowest;
        b.pos.y += pen;
        if (b.vel.y < 0) {
          const impactSpeed = -b.vel.y;
          b.vel.y = -b.vel.y * b.restitution;
          if (Math.abs(b.vel.y) < 0.4) b.vel.y = 0;
          // Friction
          b.vel.x *= 1 - b.friction * 0.35;
          b.vel.z *= 1 - b.friction * 0.35;
          b.angVel.multiplyScalar(1 - b.friction * 0.3);
          if (impactSpeed > 1.6 && b._prevSpeed > 1.0) {
            Audio.impact(b.pos, clamp(impactSpeed / 8, 0.1, 1), b.materialTag);
            FX.dust(b.pos, clamp(impactSpeed / 6, 0.2, 1));
          }
        }
        b.wake();
      }
      b._prevSpeed = b.vel.length();
    }

    // Field effects (gravity wells, wind)
    this.applyFields(dt);

    // Cull fallen bodies
    for (let i = this.bodies.length - 1; i >= 0; i--) {
      const b = this.bodies[i];
      if (b.pos.y < CONFIG.world.killY) World.removeBody(b, true);
    }
  },

  applyFields(dt) {
    const bodies = this.bodies;
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (b.invMass === 0 || b.kinematic) continue;
      for (let k = 0; k < World.fields.length; k++) {
        const f = World.fields[k];
        const d = TEMP.v1.copy(f.pos).sub(b.pos);
        const dist = d.length();
        if (dist > f.radius || dist < 0.001) continue;
        const falloff = 1 - dist / f.radius;
        d.multiplyScalar(1 / dist);
        b.vel.addScaledVector(d, f.strength * falloff * dt);
        b.wake();
      }
    }
  },

  /** Returns { normal (a→b), penetration, point } or null. */
  narrowphase(a, b) {
    if (a.shape === 'sphere' && b.shape === 'sphere') return sphereSphere(a, b);
    if (a.shape === 'sphere' && b.shape === 'box') return sphereBox(a, b);
    if (a.shape === 'box' && b.shape === 'sphere') {
      const c = sphereBox(b, a);
      if (c) { c.normal.negate(); return c; }
      return null;
    }
    return boxBox(a, b);
  },

  resolve(a, b, contact) {
    const n = contact.normal;
    const invSum = a.invMass + b.invMass;
    if (invSum <= 0) return;

    // Positional correction
    const corrMag = Math.max(contact.penetration - CONFIG.physics.skin, 0) * 0.75 / invSum;
    if (corrMag > 0) {
      a.pos.addScaledVector(n, -corrMag * a.invMass);
      b.pos.addScaledVector(n, corrMag * b.invMass);
    }

    const ra = TEMP.v1.copy(contact.point).sub(a.pos);
    const rb = TEMP.v2.copy(contact.point).sub(b.pos);

    const va = TEMP.v3.copy(a.vel).add(TEMP.v4.crossVectors(a.angVel, ra));
    const vb = TEMP.v5.copy(b.vel).add(TEMP.v6.crossVectors(b.angVel, rb));
    const rv = va.clone().negate().add(vb);

    const vn = rv.dot(n);
    if (vn > 0) return;

    const e = Math.min(a.restitution, b.restitution);
    const j = -(1 + e) * vn / invSum;
    const impulse = n.clone().multiplyScalar(j);

    a.vel.addScaledVector(impulse, -a.invMass);
    b.vel.addScaledVector(impulse, b.invMass);

    a.angVel.add(TEMP.v1.crossVectors(ra, impulse).multiplyScalar(-a.invInertia));
    b.angVel.add(TEMP.v2.crossVectors(rb, impulse).multiplyScalar(b.invInertia));

    // Coulomb friction
    const tangent = rv.clone().addScaledVector(n, -vn);
    const tl = tangent.length();
    if (tl > 1e-4) {
      tangent.multiplyScalar(1 / tl);
      const jt = -tl / invSum;
      const mu = Math.sqrt(a.friction * b.friction);
      const maxJt = Math.abs(j) * mu;
      const jtC = Math.max(jt, -maxJt);
      const fImp = tangent.multiplyScalar(jtC);
      a.vel.addScaledVector(fImp, -a.invMass);
      b.vel.addScaledVector(fImp, b.invMass);
    }

    // Impact audio
    const speed = Math.abs(vn);
    if (speed > 2.2) {
      Audio.impact(contact.point, clamp(speed / 10, 0.1, 1), a.materialTag);
    }
  },
};

/* --- Narrowphase primitives --------------------------------------------- */
function sphereSphere(a, b) {
  const d = new THREE.Vector3().subVectors(b.pos, a.pos);
  const dist = d.length();
  const rSum = a.radius + b.radius;
  if (dist >= rSum || dist < 1e-7) return null;
  const n = d.multiplyScalar(1 / dist);
  return {
    normal: n,
    penetration: rSum - dist,
    point: a.pos.clone().addScaledVector(n, a.radius),
  };
}

function sphereBox(sphere, box) {
  const invQ = box.quat.clone().invert();
  const local = sphere.pos.clone().sub(box.pos).applyQuaternion(invQ);
  const h = box.half;

  const clamped = new THREE.Vector3(
    clamp(local.x, -h.x, h.x),
    clamp(local.y, -h.y, h.y),
    clamp(local.z, -h.z, h.z)
  );
  const delta = local.clone().sub(clamped);
  const dist = delta.length();

  let normal, penetration;
  if (dist > 1e-6) {
    if (dist >= sphere.radius) return null;
    normal = delta.multiplyScalar(1 / dist);
    penetration = sphere.radius - dist;
  } else {
    // Sphere center inside the box: push out along the shallowest axis
    const dx = h.x - Math.abs(local.x);
    const dy = h.y - Math.abs(local.y);
    const dz = h.z - Math.abs(local.z);
    if (dx < dy && dx < dz) { normal = new THREE.Vector3(Math.sign(local.x) || 1, 0, 0); penetration = dx + sphere.radius; }
    else if (dy < dz) { normal = new THREE.Vector3(0, Math.sign(local.y) || 1, 0); penetration = dy + sphere.radius; }
    else { normal = new THREE.Vector3(0, 0, Math.sign(local.z) || 1); penetration = dz + sphere.radius; }
  }

  normal.applyQuaternion(box.quat).normalize();
  const point = sphere.pos.clone().addScaledVector(normal, -sphere.radius);
  return { normal, penetration, point };
}

const _axesA = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
const _axesB = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];

function boxBox(a, b) {
  quatAxis(a.quat, 0, _axesA[0]); quatAxis(a.quat, 1, _axesA[1]); quatAxis(a.quat, 2, _axesA[2]);
  quatAxis(b.quat, 0, _axesB[0]); quatAxis(b.quat, 1, _axesB[1]); quatAxis(b.quat, 2, _axesB[2]);

  const d = new THREE.Vector3().subVectors(b.pos, a.pos);
  let bestOverlap = Infinity;
  let bestAxis = null;

  const testAxis = (axis) => {
    const ra = Math.abs(_axesA[0].dot(axis)) * a.half.x +
               Math.abs(_axesA[1].dot(axis)) * a.half.y +
               Math.abs(_axesA[2].dot(axis)) * a.half.z;
    const rb = Math.abs(_axesB[0].dot(axis)) * b.half.x +
               Math.abs(_axesB[1].dot(axis)) * b.half.y +
               Math.abs(_axesB[2].dot(axis)) * b.half.z;
    const dist = Math.abs(d.dot(axis));
    const overlap = ra + rb - dist;
    if (overlap <= 0) return false;
    if (overlap < bestOverlap) {
      bestOverlap = overlap;
      bestAxis = axis.clone().multiplyScalar(d.dot(axis) < 0 ? -1 : 1).normalize();
    }
    return true;
  };

  for (let i = 0; i < 3; i++) if (!testAxis(_axesA[i])) return null;
  for (let i = 0; i < 3; i++) if (!testAxis(_axesB[i])) return null;
  if (!bestAxis) return null;

  return {
    normal: bestAxis,
    penetration: bestOverlap,
    point: a.pos.clone().add(b.pos).multiplyScalar(0.5),
  };
}

/* ==========================================================================
   08. PARTICLE / FX SYSTEM
   ========================================================================== */
const FX = {
  MAX: 900,
  points: null,
  positions: null,
  colors: null,
  sizes: null,
  velocities: null,
  life: null,
  maxLife: null,
  count: 0,
  cursor: 0,

  init(scene) {
    const geo = new THREE.BufferGeometry();
    this.positions = new Float32Array(this.MAX * 3);
    this.colors = new Float32Array(this.MAX * 3);
    this.sizes = new Float32Array(this.MAX);
    this.velocities = new Float32Array(this.MAX * 3);
    this.life = new Float32Array(this.MAX);
    this.maxLife = new Float32Array(this.MAX);

    for (let i = 0; i < this.MAX; i++) {
      this.positions[i * 3 + 1] = -9999;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(this.colors, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(this.sizes, 1));

    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTex: { value: Textures.radialGlow() },
        uPixelRatio: { value: 1.0 },
      },
      vertexShader: `
        attribute float size;
        attribute vec3 color;
        varying vec3 vColor;
        void main() {
          vColor = color;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * 300.0 / max(0.001, -mv.z);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTex;
        varying vec3 vColor;
        void main() {
          vec4 t = texture2D(uTex, gl_PointCoord);
          if (t.a < 0.02) discard;
          gl_FragColor = vec4(vColor, t.a);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexColors: true,
    });

    this.points = new THREE.Points(geo, mat);
    this.points.frustumCulled = false;
    scene.add(this.points);
  },

  emit(pos, vel, color, size, lifetime) {
    const i = this.cursor;
    this.cursor = (this.cursor + 1) % this.MAX;

    this.positions[i * 3] = pos.x;
    this.positions[i * 3 + 1] = pos.y;
    this.positions[i * 3 + 2] = pos.z;

    this.velocities[i * 3] = vel.x;
    this.velocities[i * 3 + 1] = vel.y;
    this.velocities[i * 3 + 2] = vel.z;

    this.colors[i * 3] = color.r;
    this.colors[i * 3 + 1] = color.g;
    this.colors[i * 3 + 2] = color.b;

    this.sizes[i] = size;
    this.life[i] = lifetime;
    this.maxLife[i] = lifetime;
  },

  burst(pos, count, opts = {}) {
    const color = opts.color || new THREE.Color(0xffffff);
    const speed = opts.speed || 2.5;
    const size = opts.size || 0.08;
    const life = opts.life || 0.7;
    for (let i = 0; i < count; i++) {
      const v = new THREE.Vector3(rand(-1, 1), rand(-0.3, 1), rand(-1, 1)).normalize()
        .multiplyScalar(rand(speed * 0.3, speed));
      const c = color.clone().offsetHSL(rand(-0.05, 0.05), 0, rand(-0.15, 0.15));
      this.emit(pos, v, c, size * rand(0.6, 1.5), life * rand(0.6, 1.3));
    }
  },

  dust(pos, strength = 1) {
    const c = new THREE.Color(0xa09070);
    for (let i = 0; i < Math.floor(4 + strength * 6); i++) {
      const v = new THREE.Vector3(rand(-1, 1), rand(0.2, 1), rand(-1, 1)).multiplyScalar(strength * 1.6);
      this.emit(pos, v, c, 0.06 + Math.random() * 0.06, rand(0.3, 0.7));
    }
  },

  fire(pos) {
    const c = new THREE.Color().setHSL(rand(0.02, 0.09), 1, rand(0.5, 0.68));
    const v = new THREE.Vector3(rand(-0.3, 0.3), rand(0.7, 1.6), rand(-0.3, 0.3));
    this.emit(pos, v, c, rand(0.12, 0.26), rand(0.4, 0.9));
  },

  smoke(pos) {
    const c = new THREE.Color().setHSL(0, 0, rand(0.2, 0.4));
    const v = new THREE.Vector3(rand(-0.25, 0.25), rand(0.3, 0.9), rand(-0.25, 0.25));
    this.emit(pos, v, c, rand(0.2, 0.4), rand(0.8, 1.8));
  },

  sparkle(pos, colorHex) {
    const c = new THREE.Color(colorHex || 0x66ccff);
    for (let i = 0; i < 10; i++) {
      const v = new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(rand(0.5, 2.2));
      this.emit(pos, v, c, rand(0.05, 0.12), rand(0.25, 0.6));
    }
  },

  explosion(pos, radius = 1.2) {
    const fire = new THREE.Color(0xff8822);
    const smoke = new THREE.Color(0x332e2a);
    for (let i = 0; i < 60; i++) {
      const v = new THREE.Vector3(rand(-1, 1), rand(-0.2, 1), rand(-1, 1)).normalize()
        .multiplyScalar(rand(2, 9));
      this.emit(pos, v, fire.clone().offsetHSL(0, 0, rand(-0.15, 0.15)), rand(0.15, 0.45), rand(0.4, 1.0));
    }
    for (let i = 0; i < 35; i++) {
      const v = new THREE.Vector3(rand(-1, 1), rand(0, 1.4), rand(-1, 1)).multiplyScalar(rand(1, 4));
      this.emit(pos, v, smoke, rand(0.3, 0.7), rand(1.0, 2.2));
    }
  },

  update(dt) {
    if (!this.points) return;
    const p = this.positions, v = this.velocities, l = this.life;
    for (let i = 0; i < this.MAX; i++) {
      if (l[i] <= 0) {
        if (p[i * 3 + 1] > -9000) {
          p[i * 3 + 1] = -9999;
          this.sizes[i] = 0;
        }
        continue;
      }
      l[i] -= dt;
      if (l[i] <= 0) {
        p[i * 3 + 1] = -9999;
        this.sizes[i] = 0;
        continue;
      }
      v[i * 3 + 1] -= 3.0 * dt;
      v[i * 3] *= 1 - 0.9 * dt;
      v[i * 3 + 2] *= 1 - 0.9 * dt;

      p[i * 3] += v[i * 3] * dt;
      p[i * 3 + 1] += v[i * 3 + 1] * dt;
      p[i * 3 + 2] += v[i * 3 + 2] * dt;

      const t = l[i] / this.maxLife[i];
      this.sizes[i] = this.sizes[i] * 0.995 + 0.0001;
      this.colors[i * 3] *= 1 - 0.3 * dt * (1 - t);
      this.colors[i * 3 + 1] *= 1 - 0.4 * dt * (1 - t);
      this.colors[i * 3 + 2] *= 1 - 0.4 * dt * (1 - t);
    }
    this.points.geometry.attributes.position.needsUpdate = true;
    this.points.geometry.attributes.color.needsUpdate = true;
    this.points.geometry.attributes.size.needsUpdate = true;
  },
};

   09. PLAYER RIG & CONTROLLERS
