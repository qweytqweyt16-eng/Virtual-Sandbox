const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance',
  stencil: false,
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = CONFIG.render.toneMappingExposure;
renderer.xr.enabled = true;
renderer.shadowMap.enabled = false; // Quest 2: shadows off, use fake contact shadows
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);
scene.fog = new THREE.FogExp2(0x05060a, 0.012);

const player = new THREE.Group();
scene.add(player);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.02, 220);
camera.position.set(0, 1.6, 0);
player.add(camera);

const clock = new THREE.Clock();

/* --- Controller / hand abstraction --------------------------------------- */
class Hand {
  constructor(index) {
    this.index = index;
    this.controller = renderer.xr.getController(index);
    this.grip = renderer.xr.getControllerGrip(index);
    this.controller.userData.hand = this;
    player.add(this.controller);
    player.add(this.grip);

    this.inputSource = null;
    this.handedness = index === 0 ? 'left' : 'right';
    this.gamepad = null;

    this.prevButtons = {};
    this.buttons = {};

    this.worldPos = new THREE.Vector3();
    this.worldQuat = new THREE.Quaternion();
    this.velocity = new THREE.Vector3();
    this.prevWorldPos = new THREE.Vector3();
    this.angularVelocity = new THREE.Vector3();
    this.prevWorldQuat = new THREE.Quaternion();

    this.tool = 'grab';
    this.grabbed = null;
    this.grabLocal = new THREE.Vector3();
    this.grabLocalQuat = new THREE.Quaternion();

    this.rayOrigin = new THREE.Vector3();
    this.rayDir = new THREE.Vector3(0, 0, -1);

    // Visual hand
    this.visual = this._buildHand();
    this.grip.add(this.visual);

    // Ray line
    const rayGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1),
    ]);
    this.rayLine = new THREE.Line(rayGeo, new THREE.LineBasicMaterial({
      color: 0x4aa3ff, transparent: true, opacity: 0.35,
    }));
    this.rayLine.scale.z = 0.001;
    this.controller.add(this.rayLine);

    // Pointer dot
    this.pointer = new THREE.Mesh(
      G('ptr', () => new THREE.SphereGeometry(0.012, 8, 8)),
      new THREE.MeshBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.8 })
    );
    this.pointer.visible = false;
    this.controller.add(this.pointer);

    this._bindEvents();
  }

  _buildHand() {
    const g = new THREE.Group();
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xd8b39a, roughness: 0.7, metalness: 0.0 });

    const palm = mesh(new THREE.BoxGeometry(0.075, 0.028, 0.085), skinMat);
    palm.position.set(0, 0, -0.02);
    g.add(palm);

    const fingers = [];
    for (let i = 0; i < 4; i++) {
      const f = mesh(new THREE.BoxGeometry(0.016, 0.016, 0.058), skinMat);
      f.position.set(-0.026 + i * 0.0175, 0.002, -0.09);
      g.add(f);
      fingers.push(f);
    }
    const thumb = mesh(new THREE.BoxGeometry(0.019, 0.019, 0.045), skinMat);
    thumb.position.set(0.045, -0.002, -0.045);
    thumb.rotation.y = -0.7;
    g.add(thumb);
    fingers.push(thumb);

    g.userData.fingers = fingers;
    g.userData.palm = palm;
    return g;
  }

  _bindEvents() {
    this.controller.addEventListener('connected', (e) => {
      this.inputSource = e.data;
      this.gamepad = e.data.gamepad || null;
      this.handedness = e.data.handedness || this.handedness;
      if (e.data.hand) this.isHandTracking = true;
    });
    this.controller.addEventListener('disconnected', () => {
      this.inputSource = null;
      this.gamepad = null;
    });

    this.controller.addEventListener('selectstart', () => this.onSelectStart());
    this.controller.addEventListener('selectend', () => this.onSelectEnd());
    this.controller.addEventListener('squeezestart', () => this.onSqueezeStart());
    this.controller.addEventListener('squeezeend', () => this.onSqueezeEnd());
  }

  updatePose(dt) {
    this.controller.updateWorldMatrix(true, false);
    this.prevWorldPos.copy(this.worldPos);
    this.prevWorldQuat.copy(this.worldQuat);

    this.controller.getWorldPosition(this.worldPos);
    this.controller.getWorldQuaternion(this.worldQuat);

    if (dt > 0) {
      this.velocity.copy(this.worldPos).sub(this.prevWorldPos).multiplyScalar(1 / dt);
      // Clamp to avoid insane throws from tracking glitches
      if (this.velocity.length() > 22) this.velocity.setLength(22);

      // Angular velocity (approx)
      const dq = this.worldQuat.clone().multiply(this.prevWorldQuat.clone().invert());
      const angle = 2 * Math.acos(clamp(dq.w, -1, 1));
      const s = Math.sqrt(1 - dq.w * dq.w);
      if (s > 1e-5) {
        this.angularVelocity.set(dq.x / s, dq.y / s, dq.z / s).multiplyScalar(angle / dt);
      } else {
        this.angularVelocity.set(0, 0, 0);
      }
    }

    // Ray from controller
    this.rayOrigin.copy(this.worldPos);
    this.rayDir.set(0, 0, -1).applyQuaternion(this.worldQuat).normalize();

    // Poll gamepad buttons
    this.pollGamepad();
    this.updateVisual(dt);
  }

  pollGamepad() {
    this.prevButtons = { ...this.buttons };
    this.buttons = { a: false, b: false, stick: false, trigger: false, grip: false };
    this.stickX = 0;
    this.stickY = 0;

    if (!this.gamepad) return;
    const gp = this.gamepad;
    if (gp.buttons) {
      if (gp.buttons[0]) this.buttons.trigger = gp.buttons[0].pressed || gp.buttons[0].value > 0.5;
      if (gp.buttons[1]) this.buttons.grip = gp.buttons[1].pressed || gp.buttons[1].value > 0.5;
      if (gp.buttons[3]) this.buttons.stick = gp.buttons[3].pressed;
      if (gp.buttons[4]) this.buttons.a = gp.buttons[4].pressed;
      if (gp.buttons[5]) this.buttons.b = gp.buttons[5].pressed;
    }
    if (gp.axes && gp.axes.length >= 2) {
      this.stickX = Math.abs(gp.axes[0]) > CONFIG.input.deadzone ? gp.axes[0] : 0;
      this.stickY = Math.abs(gp.axes[1]) > CONFIG.input.deadzone ? gp.axes[1] : 0;
    }
  }

  justPressed(name) {
    return this.buttons[name] && !this.prevButtons[name];
  }

  updateVisual(dt) {
    // Finger curl driven by trigger / grip
    const t = this.gamepad && this.gamepad.buttons[0] ? this.gamepad.buttons[0].value : (this.buttons.trigger ? 1 : 0);
    const g = this.gamepad && this.gamepad.buttons[1] ? this.gamepad.buttons[1].value : (this.buttons.grip ? 1 : 0);
    const curl = clamp(Math.max(t, g * 0.8), 0, 1);
    const fingers = this.visual.userData.fingers;
    if (fingers) {
      for (let i = 0; i < fingers.length; i++) {
        const f = fingers[i];
        if (i === 4) f.rotation.y = -0.7 - curl * 0.8;
        else f.rotation.x = curl * 1.5;
      }
    }

    // Ray line visual
    if (this.tool === 'grab' || this.tool === 'delete' || this.tool === 'paint') {
      this.rayLine.visible = true;
      const len = Grab.hoverTarget ? Math.max(0.1, this.rayOrigin.distanceTo(Grab.hoverPoint)) : 3.0;
      this.rayLine.scale.z = len;
      this.rayLine.material.opacity = Grab.hoverTarget ? 0.85 : 0.22;
      this.rayLine.material.color.setHex(Grab.hoverTarget ? 0x66ffcc : 0x4aa3ff);

      if (Grab.hoverTarget && Grab.hoverHand === this) {
        this.pointer.visible = true;
        this.controller.worldToLocal(this.pointer.position.copy(Grab.hoverPoint));
      } else {
        this.pointer.visible = false;
      }
    } else {
      this.rayLine.visible = false;
      this.pointer.visible = false;
    }
  }

  vibrate(intensity, duration) {
    const src = this.inputSource;
    if (src && src.gamepad && src.gamepad.hapticActuators && src.gamepad.hapticActuators.length) {
      try {
        src.gamepad.hapticActuators[0].pulse(intensity, duration);
      } catch (e) { /* ignore */ }
    }
  }

  /* ---- Tool interactions ---- */
  onSelectStart() {
    switch (this.tool) {
      case 'grab': Grab.tryGrab(this); break;
      case 'delete': Tools.deleteAt(this); break;
      case 'paint': Tools.paintAt(this); break;
      case 'freeze': Tools.freezeAt(this); break;
      case 'clone': Tools.cloneAt(this); break;
      case 'light': Tools.placeLight(this); break;
      case 'spawn': UI.catalogPick(this); break;
      case 'nuke': Tools.nuke(this); break;
    }
  }

  onSelectEnd() {
    Grab.release(this);
  }

  onSqueezeStart() {
    if (this.tool === 'grab') {
      // Grip = freeze in place
      if (this.grabbed) {
        const b = this.grabbed;
        b.kinematic = true;
        b.vel.set(0, 0, 0);
        b.angVel.set(0, 0, 0);
        Audio.uiConfirm(b.pos);
        FX.sparkle(b.pos, 0x88ccff);
        this.grabbed = null;
      }
    }
  }

  onSqueezeEnd() { }
}

const hands = [];

/* ==========================================================================
   10. LOCOMOTION
   ========================================================================== */
const Locomotion = {
  mode: 'teleport',        // 'teleport' | 'smooth'
  snapTurn: true,
  vignetteEnabled: true,

  teleportValid: false,
  teleportPoint: new THREE.Vector3(),
  teleportActive: false,

  arcLine: null,
  marker: null,

  init() {
    const arcGeo = new THREE.BufferGeometry();
    const pts = new Float32Array(32 * 3);
    arcGeo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
    this.arcLine = new THREE.Line(arcGeo, new THREE.LineBasicMaterial({
      color: 0x44ddff, transparent: true, opacity: 0.85,
    }));
    this.arcLine.frustumCulled = false;
    this.arcLine.visible = false;
    scene.add(this.arcLine);

    const ringGeo = new THREE.RingGeometry(0.16, 0.22, 24);
    ringGeo.rotateX(-Math.PI / 2);
    this.marker = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      color: 0x44ddff, transparent: true, opacity: 0.8, side: THREE.DoubleSide,
    }));
    this.marker.visible = false;
    scene.add(this.marker);
  },

  update(dt) {
    const left = hands[0];
    const right = hands[1];
    if (!left || !right) return;

    // Snap turn (right stick X)
    if (this.snapTurn) {
      if (Math.abs(right.stickX) > 0.75 && !right._turnLatch) {
        right._turnLatch = true;
        this.snapTurnBy(right.stickX > 0 ? -CONFIG.input.snapTurnAngle : CONFIG.input.snapTurnAngle);
      }
      if (Math.abs(right.stickX) < 0.4) right._turnLatch = false;
    } else {
      const turnRate = right.stickX * 1.9;
      if (Math.abs(turnRate) > 0.01) this.rotateAroundHead(turnRate * dt);
    }

    // Teleport (left stick Y)
    if (this.mode === 'teleport') {
      const stickY = -left.stickY;
      if (stickY < -0.5) {
        this.updateTeleportArc(left);
      } else if (this.teleportActive) {
        this.commitTeleport();
        this.teleportActive = false;
        this.arcLine.visible = false;
        this.marker.visible = false;
      }
    } else {
      // Smooth locomotion
      const speed = 2.4 * (left.buttons.stick ? 1.9 : 1);
      const forward = camera.getWorldDirection(TEMP.v1);
      forward.y = 0; forward.normalize();
      const rightV = TEMP.v2.set(forward.z, 0, -forward.x).normalize();
      const move = TEMP.v3.set(0, 0, 0);
      move.addScaledVector(forward, -left.stickY * speed * dt);
      move.addScaledVector(rightV, left.stickX * speed * dt);
      player.position.add(move);
    }
  },

  snapTurnBy(angle) {
    this.rotateAroundHead(angle);
    Audio.uiTick();
    hands[1] && hands[1].vibrate(0.3, 40);
  },

  rotateAroundHead(angle) {
    const head = camera.getWorldPosition(TEMP.v1);
    player.position.sub(head);
    player.position.applyAxisAngle(TEMP.v2.set(0, 1, 0), angle);
    player.position.add(head);
    player.rotateY(angle);
  },

  updateTeleportArc(hand) {
    this.teleportActive = true;
    this.arcLine.visible = true;

    const origin = hand.rayOrigin.clone();
    const dir = hand.rayDir.clone();
    const pos = origin.clone();
    const vel = dir.multiplyScalar(9.0);
    const pts = this.arcLine.geometry.attributes.position.array;
    const g = -9.81 * 0.55;

    let landed = false;
    const landing = new THREE.Vector3();

    for (let i = 0; i < 32; i++) {
      pts[i * 3] = pos.x; pts[i * 3 + 1] = pos.y; pts[i * 3 + 2] = pos.z;
      if (!landed) {
        vel.y += g * 0.045;
        pos.addScaledVector(vel, 0.045);
        if (pos.y <= CONFIG.world.floorY + 0.02) {
          pos.y = CONFIG.world.floorY + 0.02;
          landed = true;
          landing.copy(pos);
        }
      }
    }

    this.arcLine.geometry.attributes.position.needsUpdate = true;

    if (landed) {
      const dist = landing.distanceTo(hand.worldPos);
      this.teleportValid = dist < CONFIG.input.teleportMaxDist;
      this.teleportPoint.copy(landing);
      this.marker.visible = true;
      this.marker.position.copy(landing).setY(CONFIG.world.floorY + 0.012);
      this.marker.material.color.setHex(this.teleportValid ? 0x44ddff : 0xff4444);
      this.arcLine.material.color.copy(this.marker.material.color);
    } else {
      this.teleportValid = false;
      this.marker.visible = false;
    }
  },

  commitTeleport() {
    if (!this.teleportValid) { Audio.error(); return; }
    const head = camera.getWorldPosition(TEMP.v1);
    const offset = TEMP.v2.set(head.x - player.position.x, 0, head.z - player.position.z);
    player.position.x = this.teleportPoint.x - offset.x;
    player.position.z = this.teleportPoint.z - offset.z;
    Audio.teleport(this.teleportPoint);
    FX.sparkle(this.teleportPoint, 0x44ddff);
  },
};

/* ==========================================================================
   11. GRAB SYSTEM
   ========================================================================== */
const Grab = {
  hoverTarget: null,
  hoverPoint: new THREE.Vector3(),
  hoverHand: null,
  heldA: null,
  heldB: null,
  raycaster: new THREE.Raycaster(),

  /** Find the body under a hand's ray. */
  pick(hand, maxDist = 6) {
    const origin = hand.rayOrigin;
    const dir = hand.rayDir;
    let best = null;
    let bestT = maxDist;

    const bodies = Physics.bodies;
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      const toC = TEMP.v1.copy(b.pos).sub(origin);
      const t = toC.dot(dir);
      if (t < 0 || t > bestT + b.boundingRadius) continue;
      const d2 = toC.lengthSq() - t * t;
      const rr = b.boundingRadius + 0.08;
      if (d2 > rr * rr) continue;

      // Precise raycast against this object only
      this.raycaster.set(origin, dir);
      this.raycaster.far = maxDist;
      const hits = this.raycaster.intersectObject(b.obj, true);
      if (hits.length && hits[0].distance < bestT) {
        bestT = hits[0].distance;
        best = { body: b, point: hits[0].point.clone(), distance: hits[0].distance };
      }
    }
    return best;
  },

  updateHover() {
    this.hoverTarget = null;
    this.hoverHand = null;

    let bestDist = Infinity;
    for (const hand of hands) {
      if (!hand || hand.grabbed) continue;
      if (hand.tool !== 'grab' && hand.tool !== 'delete' && hand.tool !== 'paint' && hand.tool !== 'clone') continue;
      const hit = this.pick(hand);
      if (hit && hit.distance < bestDist) {
        bestDist = hit.distance;
        this.hoverTarget = hit.body;
        this.hoverPoint.copy(hit.point);
        this.hoverHand = hand;
      }
    }

    // Highlight
    if (this.hoverTarget) {
      this.hoverTarget.obj.traverse((c) => {
        if (c.isMesh && c.material && c.material.emissive && !c.userData._hl) {
          c.userData._hl = true;
          c.userData._origEmissive = c.material.emissive.getHex();
          c.material = c.material.clone();
          c.material.emissive = new THREE.Color(0x224466);
          c.material.emissiveIntensity = 0.7;
        }
      });
    }
  },

  clearHighlight(body) {
    if (!body) return;
    body.obj.traverse((c) => {
      if (c.isMesh && c.userData._hl) {
        c.userData._hl = false;
        if (c.material.emissive) {
          c.material.emissive.setHex(c.userData._origEmissive || 0x000000);
          c.material.emissiveIntensity = 1;
        }
      }
    });
  },

  tryGrab(hand) {
    const hit = this.pick(hand);
    if (!hit) return;

    const body = hit.body;

    // Two-handed manipulation: both hands on the same object
    if (this.heldA && this.heldB && this.heldA === this.heldB) {
      // already manipulating
      return;
    }

    const other = hands[0] === hand ? hands[1] : hands[0];
    if (other && other.grabbed === body) {
      // Second hand joins → enter two-handed mode
      hand.grabbed = body;
      this.beginTwoHand(body);
      return;
    }

    if (hand.grabbed) this.release(hand);

    hand.grabbed = body;
    body.kinematic = true;
    body.sleeping = false;
    body.vel.set(0, 0, 0);
    body.angVel.set(0, 0, 0);

    // Store grab offset in hand-local space
    const invHand = hand.worldQuat.clone().invert();
    hand.grabLocal.copy(body.pos).sub(hand.worldPos).applyQuaternion(invHand);
    hand.grabLocalQuat.copy(invHand).multiply(body.quat);

    this.clearHighlight(body);
    Audio.grab(body.pos, body.materialTag);
    hand.vibrate(0.55, 45);

    if (body.itemId === 'drum') Audio.drum(body.pos);
    if (body.itemId === 'bell') Audio.bell(body.pos);

    this.updateHeldRefs();
  },

  beginTwoHand(body) {
    const h0 = hands[0], h1 = hands[1];
    if (!h0.grabbed || !h1.grabbed) return;
    this.twoHand = {
      body,
      dist0: h0.worldPos.distanceTo(h1.worldPos),
      scale0: body.obj.scale.x,
    };
    Audio.uiConfirm(body.pos);
  },

  release(hand) {
    if (!hand.grabbed) return;
    const body = hand.grabbed;
    hand.grabbed = null;
    body.kinematic = false;
    body.sleeping = false;

    const speed = hand.velocity.length();
    body.vel.copy(hand.velocity).multiplyScalar(CONFIG.input.throwScale);
    body.angVel.copy(hand.angularVelocity).multiplyScalar(0.35);

    if (speed > 1.2) {
      Audio.whoosh(body.pos, clamp(speed / 4, 0.5, 2));
      hand.vibrate(0.25, 30);
    } else {
      Audio.release(body.pos);
    }

    this.twoHand = null;
    this.updateHeldRefs();
  },

  updateHeldRefs() {
    this.heldA = hands[0] ? hands[0].grabbed : null;
    this.heldB = hands[1] ? hands[1].grabbed : null;
  },

  update(dt) {
    // Two-handed scale manipulation
    if (this.twoHand && this.twoHand.body) {
      const { body, dist0, scale0 } = this.twoHand;
      const h0 = hands[0], h1 = hands[1];
      if (!h0.grabbed || !h1.grabbed || h0.grabbed !== body || h1.grabbed !== body) {
        this.twoHand = null;
      } else {
        const dist = h0.worldPos.distanceTo(h1.worldPos);
        const s = clamp(scale0 * (dist / Math.max(0.05, dist0)), 0.15, 8);
        body.obj.scale.setScalar(s);

        const mid = TEMP.v1.copy(h0.worldPos).add(h1.worldPos).multiplyScalar(0.5);
        body.pos.copy(mid);
        body.vel.set(0, 0, 0);
        return;
      }
    }

    // Per-hand follow
    for (const hand of hands) {
      if (!hand || !hand.grabbed) continue;
      const body = hand.grabbed;
      const targetPos = TEMP.v1.copy(hand.grabLocal).applyQuaternion(hand.worldQuat).add(hand.worldPos);
      body.pos.copy(targetPos);

      const targetQuat = TEMP.q1.copy(hand.worldQuat).multiply(hand.grabLocalQuat);
      body.quat.copy(targetQuat);

      body.vel.copy(hand.velocity);
      body.angVel.copy(hand.angularVelocity).multiplyScalar(0.4);
    }
  },
};

/* ==========================================================================
   12. TOOLS
   ========================================================================== */
const Tools = {
  deleteAt(hand) {
    const hit = Grab.pick(hand);
    if (!hit) { Audio.error(); return; }
    const b = hit.body;
    FX.burst(b.pos, 24, { color: new THREE.Color(0xff6644), speed: 3.5, size: 0.09, life: 0.6 });
    Audio.impact(b.pos, 0.7, 'glass');
    hand.vibrate(0.7, 60);
    World.removeBody(b, true);
  },

  paintAt(hand) {
    const hit = Grab.pick(hand);
    if (!hit) { Audio.error(); return; }
    const b = hit.body;
    const palette = [0xff5a5a, 0x5aff9c, 0x5ac8ff, 0xffe45a, 0xc77dff, 0xff8a3d, 0xffffff, 0x222831];
    const color = pick(palette);
    b.obj.traverse((c) => {
      if (c.isMesh && c.material && c.material.color) {
        if (!c.userData._paintClone) {
          c.material = c.material.clone();
          c.userData._paintClone = true;
        }
        c.material.color.setHex(color);
      }
    });
    FX.burst(hit.point, 14, { color: new THREE.Color(color), speed: 2.2, size: 0.07, life: 0.5 });
    Audio.uiConfirm(hit.point);
    hand.vibrate(0.4, 30);
  },

  freezeAt(hand) {
    const hit = Grab.pick(hand);
    if (!hit) { Audio.error(); return; }
    const b = hit.body;
    b.kinematic = !b.kinematic;
    b.vel.set(0, 0, 0);
    b.angVel.set(0, 0, 0);
    Audio.tone({ freq: b.kinematic ? 1400 : 500, sweepTo: b.kinematic ? 800 : 1200, dur: 0.2, type: 'sine', gain: 0.1, pos: b.pos });
    FX.sparkle(b.pos, 0x88ddff);
    hand.vibrate(0.5, 50);
  },

  cloneAt(hand) {
    const hit = Grab.pick(hand);
    if (!hit) { Audio.error(); return; }
    const b = hit.body;
    const cloneObj = b.obj.clone(true);
    cloneObj.position.copy(b.pos);
    cloneObj.position.y += 0.25;
    cloneObj.quaternion.copy(b.quat);
    cloneObj.scale.copy(b.obj.scale);
    cloneObj.traverse((c) => { c.userData.body = null; });
    scene.add(cloneObj);

    const def = ITEMS[b.itemId] || {};
    const newBody = new Body(cloneObj, {
      shape: b.shape, radius: b.radius, size: [b.half.x, b.half.y, b.half.z],
      mass: b.mass, mtl: b.materialTag, id: b.itemId,
    });
    Physics.add(newBody);
    Audio.uiConfirm(b.pos);
    FX.sparkle(b.pos, 0x88ffcc);
    hand.vibrate(0.4, 40);
  },

  placeLight(hand) {
    const obj = new THREE.Group();
    const bulb = new THREE.Mesh(
      new THREE.SphereGeometry(0.05, 12, 12),
      new THREE.MeshBasicMaterial({ color: 0xfff0c0 })
    );
    obj.add(bulb);
    const light = new THREE.PointLight(pick([0xffcc88, 0x88ccff, 0xff88cc, 0x88ffcc]), 3, 8, 2);
    obj.add(light);

    const spawnPos = hand.worldPos.clone().addScaledVector(hand.rayDir, 0.4);
    obj.position.copy(spawnPos);
    scene.add(obj);

    const body = new Body(obj, { shape: 'sphere', radius: 0.06, mass: 0.4, mtl: 'glass', id: 'light' });
    Physics.add(body);
    Audio.uiConfirm(spawnPos);
  },

  nuke(hand) {
    const origin = hand.worldPos.clone();
    const radius = 6;
    Audio.explode(origin);
    FX.explosion(origin, radius);
    hand.vibrate(1.0, 200);

    for (let i = Physics.bodies.length - 1; i >= 0; i--) {
      const b = Physics.bodies[i];
      if (b.pos.distanceTo(origin) < radius) World.removeBody(b, true);
    }
  },

  setTool(hand, toolId) {
    if (!hand) return;
    if (hand.grabbed) Grab.release(hand);
    hand.tool = toolId;
    Audio.uiTick(hand.worldPos);
    hand.vibrate(0.3, 25);
    UI.updateWristLabel();
  },
};

/* ==========================================================================
   13. RADIAL MENU
   ========================================================================== */
const TOOL_LIST = [
  { id: 'grab', label: 'GRAB', color: '#4aa3ff' },
  { id: 'spawn', label: 'SPAWN', color: '#4fe08a' },
  { id: 'paint', label: 'PAINT', color: '#ff8a3d' },
  { id: 'clone', label: 'CLONE', color: '#c77dff' },
  { id: 'freeze', label: 'FREEZE', color: '#88ddff' },
  { id: 'light', label: 'LIGHT', color: '#ffe45a' },
  { id: 'delete', label: 'DELETE', color: '#ff5a5a' },
  { id: 'nuke', label: 'NUKE', color: '#ff44ff' },
];

const RadialMenu = {
  group: null,
  segments: [],
  active: false,
  hand: null,
  selected: -1,

  init() {
    this.group = new THREE.Group();
    this.group.visible = false;
    scene.add(this.group);

    const R = 0.16;

    for (let i = 0; i < TOOL_LIST.length; i++) {
      const tool = TOOL_LIST[i];
      const a = (i / TOOL_LIST.length) * Math.PI * 2 - Math.PI / 2;

      const tex = this._makeIcon(tool);
      const mat = new THREE.MeshBasicMaterial({
        map: tex, transparent: true, depthTest: false, side: THREE.DoubleSide,
      });
      const geo = new THREE.PlaneGeometry(0.085, 0.085);
      const m = new THREE.Mesh(geo, mat);
      m.position.set(Math.cos(a) * R, Math.sin(a) * R, 0);
      m.userData.toolId = tool.id;
      m.userData.baseColor = new THREE.Color(tool.color);
      m.renderOrder = 999;
      this.group.add(m);
      this.segments.push(m);
    }

    // Centre label
    const cTex = this._makeCenter();
    this.center = new THREE.Mesh(
      new THREE.PlaneGeometry(0.13, 0.13),
      new THREE.MeshBasicMaterial({ map: cTex, transparent: true, depthTest: false, side: THREE.DoubleSide })
    );
    this.center.renderOrder = 999;
    this.group.add(this.center);
  },

  _makeIcon(tool) {
    const S = 128;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const ctx = c.getContext('2d');

    ctx.clearRect(0, 0, S, S);
    ctx.beginPath();
    ctx.arc(S / 2, S / 2, S / 2 - 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(10,18,30,.92)';
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = tool.color;
    ctx.stroke();

    ctx.fillStyle = tool.color;
    ctx.font = 'bold 26px -apple-system, Helvetica, Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tool.label, S / 2, S / 2);

    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  },

  _makeCenter() {
    const S = 128;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const ctx = c.getContext('2d');
    ctx.beginPath();
    ctx.arc(S / 2, S / 2, S / 2 - 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(6,12,20,.85)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,180,255,.6)';
    ctx.lineWidth = 3;
    ctx.stroke();
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  },

  open(hand) {
    if (this.active) return;
    this.active = true;
    this.hand = hand;
    this.selected = -1;
    this.group.visible = true;
    Audio.uiTick(hand.worldPos);
    hand.vibrate(0.35, 30);
  },

  close() {
    if (!this.active) return;
    this.active = false;
    this.group.visible = false;
    if (this.hand && this.selected >= 0) {
      Tools.setTool(this.hand, TOOL_LIST[this.selected].id);
    }
    this.hand = null;
    this.selected = -1;
  },

  update(dt) {
    if (!this.active || !this.hand) return;

    // Position in front of the hand, facing the player
    const h = this.hand;
    const pos = TEMP.v1.copy(h.worldPos).addScaledVector(h.rayDir, 0.28);
    this.group.position.copy(pos);
    this.group.quaternion.copy(h.worldQuat);

    // Selection via thumbstick angle
    const sx = h.stickX, sy = h.stickY;
    if (Math.abs(sx) > 0.45 || Math.abs(sy) > 0.45) {
      const ang = Math.atan2(-sy, sx); // -PI..PI, 0 = right
      let idx = Math.round(((ang + Math.PI / 2) / (Math.PI * 2)) * TOOL_LIST.length);
      idx = ((idx % TOOL_LIST.length) + TOOL_LIST.length) % TOOL_LIST.length;
      if (idx !== this.selected) {
        this.selected = idx;
        Audio.uiTick(h.worldPos);
        h.vibrate(0.2, 18);
      }
    }

    for (let i = 0; i < this.segments.length; i++) {
      const s = this.segments[i];
      const sel = i === this.selected;
      const scale = sel ? 1.32 : 1.0;
      s.scale.setScalar(lerp(s.scale.x, scale, 1 - Math.exp(-14 * dt)));
      s.material.opacity = sel ? 1.0 : 0.72;
    }
  },
};

/* ==========================================================================
   14. SPAWN CATALOG (3D panel with canvas UI)
   ========================================================================== */
const UI = {
  catalog: null,
  catalogCanvas: null,
  catalogCtx: null,
  catalogTex: null,
  catalogOpen: false,
  catalogCat: 'Primitives',
  catalogHover: -1,
  catalogItems: [],
  wristLabel: null,

  COLS: 5,
  ROWS: 4,
  CELL: 140,
  HEADER: 92,
  CANVAS_W: 1024,
  CANVAS_H: 768,

  init() {
    // --- Catalog panel ---
    this.catalogCanvas = document.createElement('canvas');
    this.catalogCanvas.width = this.CANVAS_W;
    this.catalogCanvas.height = this.CANVAS_H;
    this.catalogCtx = this.catalogCanvas.getContext('2d');

    this.catalogTex = new THREE.CanvasTexture(this.catalogCanvas);
    this.catalogTex.colorSpace = THREE.SRGBColorSpace;

    const geo = new THREE.PlaneGeometry(1.0, 0.75);
    const mat = new THREE.MeshBasicMaterial({ map: this.catalogTex, transparent: true, side: THREE.DoubleSide });
    this.catalog = new THREE.Mesh(geo, mat);
    this.catalog.visible = false;
    this.catalog.renderOrder = 500;
    scene.add(this.catalog);

    // Small wrist label showing current tool
    const c = document.createElement('canvas');
    c.width = 512; c.height = 128;
    this.wristCanvas = c;
    this.wristCtx = c.getContext('2d');
    this.wristTex = new THREE.CanvasTexture(c);
    this.wristTex.colorSpace = THREE.SRGBColorSpace;
    this.wristLabel = new THREE.Mesh(
      new THREE.PlaneGeometry(0.16, 0.04),
      new THREE.MeshBasicMaterial({ map: this.wristTex, transparent: true, depthTest: false })
    );
    this.wristLabel.renderOrder = 998;
    this.wristLabel.visible = false;
    scene.add(this.wristLabel);

    this.redrawCatalog();
  },

  openCatalog(playerPos, playerQuat) {
    this.catalogOpen = true;
    const forward = TEMP.v1.set(0, 0, -1).applyQuaternion(playerQuat);
    forward.y = 0; forward.normalize();
    this.catalog.position.copy(playerPos).addScaledVector(forward, 0.85);
    this.catalog.position.y = playerPos.y - 0.15;
    this.catalog.lookAt(playerPos.x, this.catalog.position.y, playerPos.z);
    this.catalog.visible = true;
    Audio.uiConfirm(this.catalog.position);
    this.redrawCatalog();
  },

  closeCatalog() {
    this.catalogOpen = false;
    this.catalog.visible = false;
    this.catalogHover = -1;
  },

  getCatalogItems() {
    return Object.keys(ITEMS).filter((k) => ITEMS[k].cat === this.catalogCat);
  },

  redrawCatalog() {
    const ctx = this.catalogCtx;
    const W = this.CANVAS_W, H = this.CANVAS_H;

    // Background
    ctx.clearRect(0, 0, W, H);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(12,20,34,0.96)');
    grad.addColorStop(1, 'rgba(6,10,18,0.96)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(90,160,255,0.55)';
    ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, W - 4, H - 4);

    // Title
    ctx.fillStyle = '#cfe6ff';
    ctx.font = 'bold 34px -apple-system, Helvetica, Arial';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('SPAWN CATALOG', 28, 42);

    // Categories
    const catW = (W - 56) / CATEGORIES.length;
    for (let i = 0; i < CATEGORIES.length; i++) {
      const x = 28 + i * catW;
      const active = CATEGORIES[i] === this.catalogCat;
      ctx.fillStyle = active ? 'rgba(70,160,255,0.85)' : 'rgba(40,60,90,0.5)';
      ctx.beginPath();
      ctx.roundRect(x + 4, 62, catW - 8, 34, 8);
      ctx.fill();
      ctx.fillStyle = active ? '#04121f' : '#9fc3ea';
      ctx.font = (active ? 'bold ' : '') + '17px -apple-system, Helvetica, Arial';
      ctx.textAlign = 'center';
      ctx.fillText(CATEGORIES[i].toUpperCase(), x + catW / 2, 80);
    }

    // Item grid
    this.catalogItems = this.getCatalogItems();
    const startY = this.HEADER + 20;
    for (let i = 0; i < this.catalogItems.length && i < this.COLS * this.ROWS; i++) {
      const col = i % this.COLS;
      const row = Math.floor(i / this.COLS);
      const x = 28 + col * ((W - 56) / this.COLS);
      const y = startY + row * ((H - startY - 30) / this.ROWS);
      const cw = (W - 56) / this.COLS - 12;
      const ch = (H - startY - 30) / this.ROWS - 12;

      const id = this.catalogItems[i];
      const def = ITEMS[id];
      const hovered = i === this.catalogHover;

      ctx.fillStyle = hovered ? 'rgba(70,160,255,0.35)' : 'rgba(28,42,64,0.85)';
      ctx.beginPath();
      ctx.roundRect(x, y, cw, ch, 10);
      ctx.fill();
      ctx.strokeStyle = hovered ? '#66b8ff' : 'rgba(80,120,170,0.5)';
      ctx.lineWidth = hovered ? 3 : 2;
      ctx.stroke();

      // Simple icon glyph
      ctx.fillStyle = hovered ? '#ffffff' : '#9fc3ea';
      ctx.beginPath();
      ctx.arc(x + cw / 2, y + ch * 0.36, Math.min(cw, ch) * 0.18, 0, Math.PI * 2);
      ctx.fill();

      // Name
      ctx.fillStyle = hovered ? '#ffffff' : '#cfe0f5';
      ctx.font = 'bold 16px -apple-system, Helvetica, Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(def.name, x + cw / 2, y + ch - 26);
    }

    // Footer hint
    ctx.fillStyle = 'rgba(140,180,220,0.75)';
    ctx.font = '16px -apple-system, Helvetica, Arial';
    ctx.textAlign = 'center';
    ctx.fillText('TRIGGER = SPAWN     GRIP / A = CLOSE', W / 2, H - 18);

    this.catalogTex.needsUpdate = true;
  },

  /** Raycast the catalog panel from a hand; returns grid index or -1. */
  catalogHitTest(hand) {
    if (!this.catalogOpen) return -1;
    Grab.raycaster.set(hand.rayOrigin, hand.rayDir);
    Grab.raycaster.far = 5;
    const hits = Grab.raycaster.intersectObject(this.catalog, false);
    if (!hits.length) return -1;

    const uv = hits[0].uv;
    if (!uv) return -1;

    // UV origin is bottom-left in three.js
    const px = uv.x * this.CANVAS_W;
    const py = (1 - uv.y) * this.CANVAS_H;

    // Category row?
    if (py > 58 && py < 100) {
      const catW = (this.CANVAS_W - 56) / CATEGORIES.length;
      const idx = Math.floor((px - 28) / catW);
      return { type: 'cat', index: clamp(idx, 0, CATEGORIES.length - 1) };
    }

    // Grid
    const startY = this.HEADER + 20;
    const rowH = (this.CANVAS_H - startY - 30) / this.ROWS;
    const colW = (this.CANVAS_W - 56) / this.COLS;
    if (py >= startY) {
      const col = Math.floor((px - 28) / colW);
      const row = Math.floor((py - startY) / rowH);
      if (col >= 0 && col < this.COLS && row >= 0 && row < this.ROWS) {
        const idx = row * this.COLS + col;
        if (idx < this.catalogItems.length) return { type: 'item', index: idx };
      }
    }
    return -1;
  },

  updateCatalogHover() {
    if (!this.catalogOpen) return;
    let hit = -1;
    let handHit = null;
    for (const hand of hands) {
      if (!hand) continue;
      const h = this.catalogHitTest(hand);
      if (h && h !== -1) { hit = h; handHit = hand; break; }
    }

    if (hit && hit.type === 'item') {
      if (this.catalogHover !== hit.index) {
        this.catalogHover = hit.index;
        this.redrawCatalog();
        Audio.uiTick();
      }
      if (handHit) {
        handHit.pointer.visible = true;
      }
    } else if (hit === -1) {
      if (this.catalogHover !== -1) {
        this.catalogHover = -1;
        this.redrawCatalog();
      }
    }
  },

  catalogPick(hand) {
    if (!this.catalogOpen) {
      const headPos = camera.getWorldPosition(new THREE.Vector3());
      const headQuat = camera.getWorldQuaternion(new THREE.Quaternion());
      this.openCatalog(headPos, headQuat);
      return;
    }

    const h = this.catalogHitTest(hand);
    if (h === -1) { this.closeCatalog(); return; }

    if (h.type === 'cat') {
      this.catalogCat = CATEGORIES[h.index];
      this.catalogHover = -1;
      this.redrawCatalog();
      Audio.uiConfirm(this.catalog.position);
      return;
    }

    if (h.type === 'item') {
      const id = this.catalogItems[h.index];
      if (!id) return;
      const spawnPos = hand.worldPos.clone().addScaledVector(hand.rayDir, 0.35);
      World.spawnItem(id, spawnPos, null, hand.velocity.clone().multiplyScalar(0.4));
      Audio.uiConfirm(spawnPos);
      hand.vibrate(0.5, 45);
    }
  },

  updateWristLabel() {
    if (!this.wristCanvas) return;
    const ctx = this.wristCtx;
    const W = 512, H = 128;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(8,14,24,0.85)';
    ctx.beginPath();
    ctx.roundRect(0, 0, W, H, 24);
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,160,255,0.65)';
    ctx.lineWidth = 4;
    ctx.stroke();

    const hand = hands[1] || hands[0];
    const toolId = hand ? hand.tool : 'grab';
    const tool = TOOL_LIST.find((t) => t.id === toolId) || TOOL_LIST[0];

    ctx.fillStyle = tool.color;
    ctx.font = 'bold 46px -apple-system, Helvetica, Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tool.label, W / 2, H / 2);

    this.wristTex.needsUpdate = true;
  },

  update(dt) {
    if (this.wristLabel && hands[0]) {
      const h = hands[0];
      this.wristLabel.visible = true;
      const p = TEMP.v1.copy(h.worldPos).add(TEMP.v2.set(0, 0.075, 0).applyQuaternion(h.worldQuat));
      this.wristLabel.position.copy(p);
      this.wristLabel.quaternion.copy(h.worldQuat);
      this.wristLabel.rotateX(-Math.PI / 2.4);
    }
  },
};

/* ==========================================================================
   15. WORLD / ENVIRONMENT PRESETS
   ========================================================================== */
const World = {
  envGroup: null,
  fields: [],
  currentPreset: 'void',
  spawnCounter: 0,

  init() {
    this.envGroup = new THREE.Group();
    scene.add(this.envGroup);
  },

  clear() {
    // Remove all bodies
    for (let i = Physics.bodies.length - 1; i >= 0; i--) {
      const b = Physics.bodies[i];
      scene.remove(b.obj);
    }
    Physics.bodies.length = 0;
    Grab.heldA = null;
    Grab.heldB = null;
    Grab.twoHand = null;
    for (const h of hands) if (h) h.grabbed = null;

    this.fields.length = 0;

    // Remove env objects
    while (this.envGroup.children.length) {
      const c = this.envGroup.children.pop();
      c.traverse((o) => {
        if (o.isMesh) {
          if (o.geometry && o.geometry !== undefined) { /* cached — don't dispose shared geo */ }
          if (o.material && o.material.map && o.material.map !== Textures.radialGlow()) {
            // keep shared texture cache
          }
        }
      });
      this.envGroup.remove(c);
    }

    scene.fog = new THREE.FogExp2(0x05060a, 0.012);
    scene.background = new THREE.Color(0x05060a);
  },

  spawnItem(itemId, position, quaternion, initialVel) {
    const def = ITEMS[itemId];
    if (!def) { console.warn('Unknown item', itemId); return null; }

    const obj = def.build();
    obj.position.copy(position);
    if (quaternion) obj.quaternion.copy(quaternion);
    obj.traverse((c) => { if (c.isMesh) { c.castShadow = false; c.receiveShadow = false; } });

    scene.add(obj);

    const body = new Body(obj, {
      shape: def.shape,
      radius: def.radius,
      size: def.size,
      mass: def.mass,
      mtl: def.mtl,
      id: itemId,
    });

    if (initialVel) body.vel.copy(initialVel);

    Physics.add(body);

    // Register field emitters
    obj.traverse((c) => {
      if (c.userData.field) {
        World.fields.push({
          type: c.userData.field.type,
          strength: c.userData.field.strength,
          radius: c.userData.field.radius,
          pos: new THREE.Vector3(),
          obj: obj,
        });
      }
    });

    this.spawnCounter++;
    return body;
  },

  removeBody(body, destroyVisual = true) {
    Physics.remove(body);
    if (destroyVisual) scene.remove(body.obj);
    if (Grab.heldA === body) Grab.heldA = null;
    if (Grab.heldB === body) Grab.heldB = null;
    if (Grab.twoHand && Grab.twoHand.body === body) Grab.twoHand = null;
    for (const h of hands) if (h && h.grabbed === body) h.grabbed = null;

    for (let i = this.fields.length - 1; i >= 0; i--) {
      if (this.fields[i].obj === body.obj) this.fields.splice(i, 1);
    }
  },

  updateFields() {
    for (const f of this.fields) {
      if (f.obj) f.obj.getWorldPosition(f.pos);
    }
  },

  /* ---------- Environment builders ---------- */
  buildSky(opts = {}) {
    const geo = new THREE.SphereGeometry(180, 24, 16);
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        topColor: { value: new THREE.Color(opts.top || 0x0a1730) },
        bottomColor: { value: new THREE.Color(opts.bottom || 0x1b2a45) },
        offset: { value: opts.offset || 12 },
        exponent: { value: opts.exponent || 0.7 },
      },
      vertexShader: `
        varying vec3 vWorld;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorld = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 bottomColor;
        uniform float offset;
        uniform float exponent;
        varying vec3 vWorld;
        void main() {
          float h = normalize(vWorld + vec3(0.0, offset, 0.0)).y;
          float t = pow(max(h, 0.0), exponent);
          gl_FragColor = vec4(mix(bottomColor, topColor, t), 1.0);
        }
      `,
      side: THREE.BackSide,
      depthWrite: false,
      fog: false,
    });
    const sky = new THREE.Mesh(geo, mat);
    sky.frustumCulled = false;
    this.envGroup.add(sky);
    return sky;
  },

  buildStars(count = 1400, radius = 150) {
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const v = new THREE.Vector3().randomDirection().multiplyScalar(radius * rand(0.7, 1));
      v.y = Math.abs(v.y) * 0.9 + 8;
      pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({
      color: 0xffffff, size: 0.9, sizeAttenuation: true,
      map: Textures.softDisc(), transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, fog: false,
    });
    const pts = new THREE.Points(geo, mat);
    pts.frustumCulled = false;
    this.envGroup.add(pts);
    return pts;
  },

  buildFloor(material, size = 120, y = 0) {
    const geo = new THREE.PlaneGeometry(size, size, 1, 1);
    geo.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(geo, material);
    m.position.y = y;
    m.receiveShadow = false;
    this.envGroup.add(m);
    return m;
  },

  buildGrid(size = 80, divisions = 80, color = 0x1e3350) {
    const grid = new THREE.GridHelper(size, divisions, color, color);
    grid.material.transparent = true;
    grid.material.opacity = 0.5;
    grid.position.y = 0.005;
    this.envGroup.add(grid);
    return grid;
  },

  buildGrassInstanced(count = 1600, spread = 46) {
    const geo = new THREE.ConeGeometry(0.045, 0.32, 3);
    geo.translate(0, 0.16, 0);
    const mat = new THREE.MeshStandardMaterial({ color: 0x4a9a3a, roughness: 1, metalness: 0 });
    const inst = new THREE.InstancedMesh(geo, mat, count);
    inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const m = new THREE.Matrix4();
    const q = new THREE.Quaternion();
    const s = new THREE.Vector3();
    const p = new THREE.Vector3();
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * spread;
      p.set(Math.cos(a) * r, 0, Math.sin(a) * r);
      q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * Math.PI);
      const sc = rand(0.6, 1.6);
      s.set(sc, sc, sc);
      m.compose(p, q, s);
      inst.setMatrixAt(i, m);
    }
    inst.instanceMatrix.needsUpdate = true;
    inst.frustumCulled = false;
    this.envGroup.add(inst);
    return inst;
  },

  buildTrees(count = 14, spread = 30) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = rand(6, spread);
      const p = new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r);
      const obj = ITEMS.tree.build();
      obj.position.copy(p);
      obj.rotation.y = Math.random() * Math.PI * 2;
      obj.scale.setScalar(rand(0.8, 1.5));
      this.envGroup.add(obj);
    }
  },

  buildOcean(size = 200) {
    const geo = new THREE.PlaneGeometry(size, size, 60, 60);
    geo.rotateX(-Math.PI / 2);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uColorA: { value: new THREE.Color(0x1a5fa8) }, uColorB: { value: new THREE.Color(0x4ec8e8) } },
      vertexShader: `
        uniform float uTime;
        varying vec3 vPos;
        varying float vWave;
        void main() {
          vec3 p = position;
          float w = sin(p.x * 0.22 + uTime * 1.1) * 0.16
                  + sin(p.z * 0.31 + uTime * 0.85) * 0.12
                  + sin((p.x + p.z) * 0.13 + uTime * 0.6) * 0.10;
          p.y += w;
          vWave = w;
          vPos = p;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uColorA;
        uniform vec3 uColorB;
        varying vec3 vPos;
        varying float vWave;
        void main() {
          float t = clamp(vWave * 2.2 + 0.5, 0.0, 1.0);
          vec3 col = mix(uColorA, uColorB, t);
          gl_FragColor = vec4(col, 0.92);
        }
      `,
      transparent: true,
      side: THREE.DoubleSide,
    });
    const water = new THREE.Mesh(geo, mat);
    water.position.y = -0.15;
    this.envGroup.add(water);
    this.oceanMat = mat;
    return water;
  },

  presetVoid() {
    scene.background = new THREE.Color(0x05060a);
    scene.fog = new THREE.FogExp2(0x05060a, 0.014);
    this.buildGrid(80, 80, 0x1a2c44);
    this.buildStars(1600, 140);
    this.addAmbientLight(0x335577, 0.7);
    this.addSunLight(0x88aaff, 0.55, new THREE.Vector3(-8, 14, 6));
    Physics.gravity = -9.81;
  },

  presetGrassland() {
    scene.background = new THREE.Color(0x87b8e8);
    scene.fog = new THREE.FogExp2(0x9dc4ea, 0.0085);
    this.buildSky({ top: 0x3d7fd0, bottom: 0xbcd9f2, exponent: 0.85 });
    this.buildFloor(new THREE.MeshStandardMaterial({ map: Textures.grass(), roughness: 1 }), 200, 0);
    this.buildGrassInstanced(1800, 48);
    this.buildTrees(16, 34);
    this.addAmbientLight(0xbfd8f0, 0.85);
    this.addSunLight(0xfff2d0, 2.4, new THREE.Vector3(12, 24, 8));
    Physics.gravity = -9.81;
  },

  presetBeach() {
    scene.background = new THREE.Color(0x9fd4f0);
    scene.fog = new THREE.FogExp2(0xa9dcf2, 0.0065);
    this.buildSky({ top: 0x2f8fdd, bottom: 0xd8eefb, exponent: 0.9 });
    this.buildFloor(new THREE.MeshStandardMaterial({ map: Textures.sand(), roughness: 1 }), 200, 0);
    this.buildOcean(220);
    for (let i = 0; i < 10; i++) {
      const a = rand(0, Math.PI * 2), r = rand(8, 30);
      const palm = new THREE.Group();
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 1 });
      for (let s = 0; s < 5; s++) {
        const seg = Prim.cyl(0.09 - s * 0.008, 0.1 - s * 0.008, 0.55, trunkMat, 8);
        seg.position.y = 0.28 + s * 0.5;
        seg.position.x = Math.sin(s * 0.18) * 0.24;
        seg.rotation.z = -0.1;
        palm.add(seg);
      }
      const leafMat = new THREE.MeshStandardMaterial({ color: 0x2f8f3a, roughness: 0.95, side: THREE.DoubleSide });
      for (let l = 0; l < 7; l++) {
        const leaf = Prim.cone(0.1, 1.1, leafMat, 4);
        const la = (l / 7) * Math.PI * 2;
        leaf.position.set(Math.cos(la) * 0.5, 2.6, Math.sin(la) * 0.5);
        leaf.rotation.set(Math.PI / 2.4, la, 0.4);
        palm.add(leaf);
      }
      palm.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
      this.envGroup.add(palm);
    }
    this.addAmbientLight(0xd0e8ff, 0.9);
    this.addSunLight(0xfff0c8, 2.8, new THREE.Vector3(20, 26, -10));
    Physics.gravity = -9.81;
  },

  presetSpace() {
    scene.background = new THREE.Color(0x000004);
    scene.fog = null;
    this.buildStars(2600, 170);
    this.buildFloor(new THREE.MeshStandardMaterial({ color: 0x11151f, roughness: 0.9 }), 120, 0);
    for (let i = 0; i < 18; i++) {
      const r = Prim.sphere(rand(0.3, 1.4), MatLib.get('stone'), 10);
      r.position.set(rand(-28, 28), rand(1, 14), rand(-28, 28));
      r.scale.set(rand(0.7, 1.3), rand(0.7, 1.3), rand(0.7, 1.3));
      this.envGroup.add(r);
    }
    this.addAmbientLight(0x445577, 1.0);
    this.addSunLight(0xffffff, 1.8, new THREE.Vector3(10, 18, 8));
    Physics.gravity = -1.6;
  },

  presetUnderwater() {
    scene.background = new THREE.Color(0x04202e);
    scene.fog = new THREE.FogExp2(0x0a3a52, 0.048);
    this.buildFloor(new THREE.MeshStandardMaterial({ map: Textures.sand(), color: 0x5a8fa0, roughness: 1 }), 160, 0);
    for (let i = 0; i < 24; i++) {
      const rock = ITEMS.rock.build();
      rock.position.set(rand(-30, 30), 0, rand(-30, 30));
      rock.scale.setScalar(rand(0.6, 2.2));
      this.envGroup.add(rock);
    }
    this.addAmbientLight(0x2f7fa8, 1.4);
    this.addSunLight(0x7fd0ff, 1.2, new THREE.Vector3(4, 20, 4));
    Physics.gravity = -4.0;
  },

  presetArena() {
    scene.background = new THREE.Color(0x1a1410);
    scene.fog = new THREE.FogExp2(0x2a2018, 0.02);
    this.buildSky({ top: 0x2a1f18, bottom: 0x6a4a30, exponent: 0.7 });
    this.buildFloor(new THREE.MeshStandardMaterial({ map: Textures.sand(), color: 0xa88060, roughness: 1 }), 60, 0);
    const wallMat = new THREE.MeshStandardMaterial({ map: Textures.stone(), color: 0x8a7a68, roughness: 1 });
    const R = 14, H = 5;
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      const w = new THREE.Mesh(new THREE.BoxGeometry(R * 0.28, H, 0.5), wallMat);
      w.position.set(Math.cos(a) * R, H / 2, Math.sin(a) * R);
      w.rotation.y = -a + Math.PI / 2;
      this.envGroup.add(w);
    }
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const pillar = Prim.cyl(0.45, 0.55, 6, wallMat, 10);
      pillar.position.set(Math.cos(a) * (R - 3), 3, Math.sin(a) * (R - 3));
      this.envGroup.add(pillar);
    }
    this.addAmbientLight(0xffcc99, 0.8);
    this.addSunLight(0xffddaa, 2.0, new THREE.Vector3(6, 22, 4));
    Physics.gravity = -9.81;
  },

  presetWarehouse() {
    scene.background = new THREE.Color(0x14181f);
    scene.fog = new THREE.FogExp2(0x14181f, 0.012);
    const floorMat = new THREE.MeshStandardMaterial({ map: Textures.checker(), roughness: 0.85 });
    this.buildFloor(floorMat, 60, 0);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a3038, roughness: 0.9 });
    const W = 24, H = 8;
    for (const [x, z, ry] of [[0, -W / 2, 0], [0, W / 2, 0], [-W / 2, 0, Math.PI / 2], [W / 2, 0, Math.PI / 2]]) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.4), wallMat);
      wall.position.set(x, H / 2, z);
      wall.rotation.y = ry;
      this.envGroup.add(wall);
    }
    const ceil = new THREE.Mesh(new THREE.BoxGeometry(W, 0.3, W), wallMat);
    ceil.position.y = H;
    this.envGroup.add(ceil);
    for (let i = 0; i < 10; i++) {
      const p = new THREE.Vector3(rand(-9, 9), 0.25, rand(-9, 9));
      const obj = ITEMS.crate.build();
      obj.position.copy(p);
      obj.rotation.y = Math.random() * Math.PI;
      this.envGroup.add(obj);
    }
    for (let i = 0; i < 4; i++) {
      const l = new THREE.PointLight(0xffe0b0, 2.2, 22, 2);
      l.position.set(rand(-8, 8), 7, rand(-8, 8));
      this.envGroup.add(l);
    }
    this.addAmbientLight(0x8899aa, 0.7);
    Physics.gravity = -9.81;
  },

  addAmbientLight(color, intensity) {
    const l = new THREE.AmbientLight(color, intensity);
    this.envGroup.add(l);
  },

  addSunLight(color, intensity, dir) {
    const l = new THREE.DirectionalLight(color, intensity);
    l.position.copy(dir);
    this.envGroup.add(l);
    const t = new THREE.Object3D();
    t.position.set(0, 0, 0);
    this.envGroup.add(t);
    l.target = t;
    return l;
  },

  loadPreset(name) {
    this.clear();
    this.currentPreset = name;
    switch (name) {
      case 'grassland': this.presetGrassland(); break;
      case 'beach': this.presetBeach(); break;
      case 'space': this.presetSpace(); break;
      case 'underwater': this.presetUnderwater(); break;
      case 'arena': this.presetArena(); break;
      case 'warehouse': this.presetWarehouse(); break;
      default: this.presetVoid(); break;
    }
    Audio.uiConfirm(new THREE.Vector3(0, 1, 0));
  },
};

/* ==========================================================================
   16. SAVE / LOAD (IndexedDB)
   ========================================================================== */
const SaveSystem = {
  db: null,
  DB_NAME: 'voidbox',
  STORE: 'worlds',

  async open() {
    return new Promise((resolve) => {
      try {
        const req = indexedDB.open(this.DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(this.STORE)) db.createObjectStore(this.STORE);
        };
        req.onsuccess = () => { this.db = req.result; resolve(true); };
        req.onerror = () => { console.warn('IndexedDB unavailable'); resolve(false); };
      } catch (e) { resolve(false); }
    });
  },

  async put(key, value) {
    if (!this.db) return false;
    return new Promise((resolve) => {
      try {
        const tx = this.db.transaction(this.STORE, 'readwrite');
        tx.objectStore(this.STORE).put(value, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      } catch (e) { resolve(false); }
    });
  },

  async get(key) {
    if (!this.db) return null;
    return new Promise((resolve) => {
      try {
        const tx = this.db.transaction(this.STORE, 'readonly');
        const req = tx.objectStore(this.STORE).get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
  },

  serialize() {
    const objects = [];
    for (const b of Physics.bodies) {
      objects.push({
        id: b.itemId,
        p: [b.pos.x, b.pos.y, b.pos.z],
        q: [b.quat.x, b.quat.y, b.quat.z, b.quat.w],
        s: [b.obj.scale.x, b.obj.scale.y, b.obj.scale.z],
        m: b.mass,
        sh: b.shape,
        r: b.radius,
        h: [b.half.x, b.half.y, b.half.z],
        mt: b.materialTag,
        k: b.kinematic,
      });
    }
    return {
      version: VERSION,
      preset: World.currentPreset,
      gravity: Physics.gravity,
      objects,
      savedAt: Date.now(),
    };
  },

  async save(slot = 'slot1') {
    const data = this.serialize();
    const ok = await this.put(slot, data);
    if (ok) {
      Audio.uiConfirm(new THREE.Vector3(0, 1.5, -1));
      console.log(`[VOIDBOX] Saved ${data.objects.length} objects to ${slot}`);
    }
    return ok;
  },

  async load(slot = 'slot1') {
    const data = await this.get(slot);
    if (!data) return false;

    World.clear();
    World.loadPreset(data.preset || 'void');
    Physics.gravity = data.gravity || -9.81;

    for (const o of data.objects) {
      if (!ITEMS[o.id]) continue;
      const pos = new THREE.Vector3(o.p[0], o.p[1], o.p[2]);
      const quat = new THREE.Quaternion(o.q[0], o.q[1], o.q[2], o.q[3]);
      const body = World.spawnItem(o.id, pos, quat, null);
      if (body) {
        body.obj.scale.set(o.s[0], o.s[1], o.s[2]);
        if (o.k) body.kinematic = true;
      }
    }
    Audio.uiConfirm(new THREE.Vector3(0, 1.5, -1));
    return true;
  },
};

/* ==========================================================================
   17. ADAPTIVE PERFORMANCE
   ========================================================================== */
const Perf = {
  frameTimes: [],
  avg: 16.7,
  lowQuality: false,
  checkTimer: 0,
  foveation: CONFIG.render.foveation,

  update(dt) {
    this.frameTimes.push(dt * 1000);
    if (this.frameTimes.length > 60) this.frameTimes.shift();

    this.checkTimer += dt;
    if (this.checkTimer < 1.0) return;
    this.checkTimer = 0;

    let sum = 0;
    for (const t of this.frameTimes) sum += t;
    this.avg = sum / Math.max(1, this.frameTimes.length);

    // Adaptive foveation (Quest 2 supports 0..3)
    if (this.avg > 14.5 && this.foveation < 3) {
      this.foveation++;
      this.applyFoveation();
    } else if (this.avg < 11.0 && this.foveation > 0) {
      this.foveation--;
      this.applyFoveation();
    }

    // Toggle heavy effects
    const wantLow = this.avg > 16;
    if (wantLow !== this.lowQuality) {
      this.lowQuality = wantLow;
      if (FX.points) FX.points.visible = !wantLow;
    }
  },

  applyFoveation() {
    try {
      if (renderer.xr && renderer.xr.setFoveation) renderer.xr.setFoveation(this.foveation);
    } catch (e) { /* not supported */ }
  },
};

/* ==========================================================================
   18. MAIN LOOP
   ========================================================================== */
let lastTime = 0;
let xrSession = null;

function updateHands(dt) {
  for (const hand of hands) {
    if (hand) hand.updatePose(dt);
  }
}

function handleButtons() {
  for (let i = 0; i < hands.length; i++) {
    const hand = hands[i];
    if (!hand) continue;

    // B / Y → radial menu
    if (hand.justPressed('b')) {
      if (RadialMenu.active) {
        RadialMenu.close();
      } else {
        RadialMenu.open(hand);
      }
    }

    // A / X → spawn catalog
    if (hand.justPressed('a')) {
      if (UI.catalogOpen) {
        UI.closeCatalog();
      } else {
        const headPos = camera.getWorldPosition(new THREE.Vector3());
        const headQuat = camera.getWorldQuaternion(new THREE.Quaternion());
        UI.openCatalog(headPos, headQuat);
      }
    }
  }
}

function animateLoop() {
  const dtRaw = clock.getDelta();
  const dt = Math.min(dtRaw, 0.1);

  // Hands
  updateHands(dt);

  // Buttons
  handleButtons();

  // Radial menu
  RadialMenu.update(dt);
  if (RadialMenu.active && RadialMenu.hand && !RadialMenu.hand.buttons.b) {
    // released B → commit
    if (RadialMenu.selected >= 0) RadialMenu.close();
    else if (!RadialMenu.hand.buttons.b && RadialMenu._bHeld) RadialMenu.close();
  }
  if (RadialMenu.active) RadialMenu._bHeld = true;
  else RadialMenu._bHeld = false;

  // Hover / grab
  Grab.updateHover();
  Grab.update(dt);

  // Catalog hover
  UI.updateCatalogHover();

  // Locomotion
  Locomotion.update(dt);

  // UI
  UI.update(dt);

  // Physics (fixed timestep with accumulator)
  Physics.accumulator += dt;
  let steps = 0;
  while (Physics.accumulator >= CONFIG.physics.fixedStep && steps < CONFIG.physics.maxSubSteps) {
    World.updateFields();
    Physics.step(CONFIG.physics.fixedStep);
    Physics.accumulator -= CONFIG.physics.fixedStep;
    steps++;
  }
  if (steps === CONFIG.physics.maxSubSteps) Physics.accumulator = 0;

  // Effects
  FX.update(dt);

  // Ocean animation
  if (World.oceanMat) World.oceanMat.uniforms.uTime.value += dt;

  // Audio listener
  Audio.updateListener(camera);

  // Performance
  Perf.update(dt);

  // Render
  renderer.render(scene, camera);
}

/* ==========================================================================
   19. BOOTSTRAP
   ========================================================================== */
function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);

function showError(msg) {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = msg;
  const ring = document.getElementById('ring');
  if (ring) ring.style.display = 'none';
  const st = document.getElementById('status');
  if (st) st.textContent = 'Unavailable';
}

async function bootstrap() {
  const statusEl = document.getElementById('status');
  const enterBtn = document.getElementById('enterBtn');

  // Init systems that don't need XR
  Audio.init();
  World.init();
  FX.init(scene);
  Locomotion.init();
  RadialMenu.init();
  UI.init();

  // Hands
  hands[0] = new Hand(0);
  hands[1] = new Hand(1);
  UI.updateWristLabel();

  // Default world
  World.loadPreset('void');

  // Kick a small demo scene
  World.spawnItem('cube', new THREE.Vector3(-0.6, 0.6, -1.6), null, null);
  World.spawnItem('sphere', new THREE.Vector3(0, 0.8, -1.8), null, null);
  World.spawnItem('crate', new THREE.Vector3(0.7, 0.3, -2.0), null, null);
  World.spawnItem('bell', new THREE.Vector3(0.9, 0.9, -1.4), null, null);

  await SaveSystem.open();

  // WebXR support check
  if (!navigator.xr) {
    showError('WebXR is not available in this browser. VOIDBOX requires a WebXR-capable browser on Meta Quest 2 or another VR headset.');
    return;
  }

  let supported = false;
  try {
    supported = await navigator.xr.isSessionSupported('immersive-vr');
  } catch (e) {
    supported = false;
  }

  if (!supported) {
    showError('Immersive VR is not supported on this device. Open this page in the Meta Quest Browser on your headset.');
    return;
  }

  statusEl.textContent = 'Headset ready';
  document.getElementById('ring').style.display = 'none';
  enterBtn.style.display = 'inline-block';

  enterBtn.addEventListener('click', async () => {
    enterBtn.disabled = true;
    statusEl.textContent = 'Starting VR session…';
    try {
      await enterVR();
    } catch (e) {
      console.error(e);
      statusEl.textContent = 'Failed to start: ' + (e && e.message ? e.message : e);
      enterBtn.disabled = false;
    }
  });

  renderer.setAnimationLoop(animateLoop);
}

async function enterVR() {
  Audio.init();
  Audio.resume();

  const sessionInit = {
    requiredFeatures: ['local-floor'],
    optionalFeatures: ['bounded-floor', 'hand-tracking', 'layers', 'anchors', 'hit-test'],
  };

  const session = await navigator.xr.requestSession('immersive-vr', sessionInit);
  xrSession = session;

  renderer.xr.setReferenceSpaceType('local-floor');
  renderer.xr.setFoveation(CONFIG.render.foveation);
  await renderer.xr.setSession(session);

  session.addEventListener('end', () => {
    xrSession = null;
    document.getElementById('boot').classList.remove('hidden');
    document.getElementById('enterBtn').style.display = 'inline-block';
    document.getElementById('enterBtn').disabled = false;
    document.getElementById('status').textContent = 'Session ended';
  });

  session.addEventListener('visibilitychange', () => {
    if (document.hidden) Audio.master && (Audio.master.gain.value = 0);
    else Audio.master && (Audio.master.gain.value = CONFIG.audio.masterVolume);
  });

  // Hide boot screen
  document.getElementById('boot').classList.add('hidden');

  // Reposition player to a comfortable spot
  player.position.set(0, 0, 0);

  // Refresh tool label
  UI.updateWristLabel();

  // Welcome chime
  setTimeout(() => {
    Audio.bell(new THREE.Vector3(0, 1.5, -1), 880);
  }, 400);
}

/* ---- Global error handling so a bad frame never bricks the app ---- */
window.addEventListener('error', (e) => {
  console.error('[VOIDBOX] Uncaught error:', e.message, e.filename, e.lineno);
});
window.addEventListener('unhandledrejection', (e) => {
  console.error('[VOIDBOX] Unhandled rejection:', e.reason);
});

/* ---- Go ---- */
bootstrap().catch((e) => {
  console.error(e);
  showError('Boot failure: ' + (e && e.message ? e.message : e));
});
